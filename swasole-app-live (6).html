<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swasole</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --ink:#2B2622; --ink-soft:#8A7E72;
  --gold:#B8824F; --gold-deep:#8C6239; --sage:#69795F; --rose:#A5483F; --line:#E6DCCF;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:28px;letter-spacing:0.02em;color:var(--ink);}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;}
h1{font-size:26px;} h2{font-size:20px;} h3{font-size:17px;}
.app{display:flex;min-height:100vh;}
.login-screen{min-height:100vh;align-items:center;justify-content:center;background:var(--bg);}
.login-screen.show{display:flex;}
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:28px 0 20px;display:flex;flex-direction:column;}
.sidebar .brand{padding:0 24px 24px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.navitem{padding:11px 24px;color:var(--ink-soft);cursor:pointer;font-size:13px;letter-spacing:0.02em;border-left:2px solid transparent;display:flex;align-items:center;gap:10px;}
.navitem:hover{color:var(--ink);}
.navitem.active{color:var(--ink);border-left-color:var(--gold);background:#FAF6F0;font-weight:600;}
.main{flex:1;padding:32px 40px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap;gap:10px;}
.hairline{border:none;border-top:1px solid var(--line);margin:20px 0;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 18px;font-size:13px;font-weight:600;letter-spacing:0.01em;}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
button.small{padding:5px 11px;font-size:12px;}
button:disabled{opacity:0.5;cursor:not-allowed;}
button:hover:not(:disabled){opacity:0.85;}
input,select,textarea{font-family:'Inter',sans-serif;padding:9px 11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;width:100%;}
label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.02em;}
.field{margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--ink);}
td{padding:11px 10px;border-bottom:1px solid var(--line);}
tr:hover td{background:#FCFAF6;}
.num{font-variant-numeric:tabular-nums;text-align:right;}
.tag{display:inline-block;padding:2px 9px;font-size:11px;border:1px solid var(--line);color:var(--ink-soft);}
.modal-backdrop{position:fixed;inset:0;background:rgba(43,38,34,0.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--surface);width:100%;max-width:520px;padding:28px;max-height:88vh;overflow-y:auto;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px;}
.kpi{background:var(--surface);padding:18px 20px;}
.kpi .label{font-size:11px;color:var(--ink-soft);letter-spacing:0.03em;text-transform:uppercase;margin-bottom:6px;}
.kpi .value{font-family:'Inter',sans-serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.section-title{font-size:12px;letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:flex-end;}
.filters .field{margin-bottom:0;min-width:140px;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:190px;padding:10px 4px 0;overflow-x:auto;}
.bar-chart .col{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-chart .bar{width:100%;max-width:34px;background:var(--gold);min-height:2px;}
.bar-chart .barlabel{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.3;margin-top:6px;white-space:nowrap;}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.hbar-row .name{width:150px;font-size:12.5px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hbar-track{flex:1;background:var(--line);height:14px;position:relative;}
.hbar-fill{background:var(--gold);height:100%;}
.hbar-val{width:80px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0;}
.empty{color:var(--ink-soft);font-size:13px;padding:30px 0;text-align:center;}
.pos-grid{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start;}
.cart-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.badge-low{color:var(--rose);}
.role-note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.imgbox{width:56px;height:56px;background:var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);overflow:hidden;}
.imgbox img{width:100%;height:100%;object-fit:cover;}
.mobile-tabs{display:none;}
.statusbar{font-size:12px;padding:8px 14px;border:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.statusbar.ok{color:var(--sage);border-color:var(--sage);}
.statusbar.err{color:var(--rose);border-color:var(--rose);}
@media(max-width:820px){
  .sidebar{display:none;}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;}
  .mobile-tabs .navitem{flex:1;flex-direction:column;font-size:10px;padding:9px 4px;text-align:center;border-left:none;border-top:2px solid transparent;gap:3px;}
  .mobile-tabs .navitem.active{border-top-color:var(--gold);border-left:none;background:transparent;}
  .main{padding:20px 16px 84px;}
  .pos-grid{grid-template-columns:1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
}
@media print{
  body *{visibility:hidden;}
  #printInvoice, #printInvoice *{visibility:visible;}
  #printInvoice{position:absolute;top:0;left:0;width:100%;padding:20px;}
  .modal-backdrop{position:static;background:none;padding:0;}
  .modal{box-shadow:none;max-width:none;padding:0;}
}

<body>
<div id="loginScreen" class="login-screen" style="display:none;">

<script>
// ====== SUPABASE CONNECTION ======
const SUPABASE_URL = "https://gwsomnnqnzhfeutgvjym.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0-2EQfzHSbPtAyHUIq4xOg_2VT7_kNv";
const sbRaw = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// If the latest SQL update has not been run yet, the new bill fields are left out of saves instead of making them fail.
const sb = { auth: sbRaw.auth, from(table){
  const q = sbRaw.from(table);
  return new Proxy(q, { get(target, prop){
    if(prop === 'insert' || prop === 'update') return (payload, ...rest) => target[prop](stripExtras(table, payload), ...rest);
    const v = target[prop];
    return typeof v === 'function' ? v.bind(target) : v;
  }});
}};

const NAV = [
  {id:'dashboard', label:'Dashboard'},
  {id:'pos', label:'Billing'},
  {id:'orders', label:'Orders'},
  {id:'reports', label:'Reports'},
  {id:'products', label:'Products'},
  {id:'customers', label:'Customers'},
  {id:'wholesale', label:'Wholesale'},
  {id:'team', label:'Team'},
  {id:'company', label:'Company'},
];

let state = { categories:[], products:[], customers:[], sales:[], saleItems:[], team:[], company:null, wholesaleAccounts:[], wholesaleOrders:[], wholesaleOrderItems:[], route:'dashboard', loaded:false, connError:null };
const inr = (n) => '₹' + (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});
const APP_VERSION = '2026.10.06-g';
const EXTRA_COLS = {
  products: ['hsn_code','mrp'], sale_items: ['hsn_code','mrp'], customers: ['gstin'],
  sales: ['buyer_gstin','place_of_supply','notes'], company_settings: ['default_hsn','bank_details','terms'],
};
let extrasAvailable = true;
function stripExtras(table, payload){
  if(extrasAvailable || !EXTRA_COLS[table]) return payload;
  const strip = (o) => { const copy = {...o}; EXTRA_COLS[table].forEach(k => delete copy[k]); return copy; };
  return Array.isArray(payload) ? payload.map(strip) : strip(payload);
}
const INDIAN_STATES = {'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar Islands','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh'};
function stateLabelFromGstin(g){ const code = String(g||'').trim().slice(0,2); return INDIAN_STATES[code] ? `${INDIAN_STATES[code]} (${code})` : ''; }
function companyStateLabel(){ return stateLabelFromGstin(state.company && state.company.gstin); }
function hsnFor(p){ return (p && p.hsn_code) || (state.company && state.company.default_hsn) || ''; }
function mrpFor(p){ return p && Number(p.mrp) > 0 ? Number(p.mrp) : Number(p && p.selling_price) || 0; }
function localDateStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function rupeesInWords(amount){
  const n = Math.round((Number(amount)||0)*100)/100;
  const rupees = Math.floor(n), paise = Math.round((n - rupees)*100);
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = (x) => x < 20 ? ones[x] : tens[Math.floor(x/10)] + (x%10 ? ' ' + ones[x%10] : '');
  const three = (x) => (x >= 100 ? ones[Math.floor(x/100)] + ' Hundred' + (x%100 ? ' ' : '') : '') + (x%100 ? two(x%100) : '');
  let x = rupees; const parts = [];
  const crore = Math.floor(x/10000000); x %= 10000000;
  const lakh = Math.floor(x/100000); x %= 100000;
  const thousand = Math.floor(x/1000); x %= 1000;
  if(crore) parts.push(three(crore) + ' Crore');
  if(lakh) parts.push(two(lakh) + ' Lakh');
  if(thousand) parts.push(two(thousand) + ' Thousand');
  if(x) parts.push(three(x));
  const words = parts.length ? parts.join(' ') : 'Zero';
  return 'Rupees ' + words + (paise ? ' and ' + two(paise) + ' Paise' : '') + ' Only';
}
// next bill number in the same style as the latest numbered bill (e.g. after SW207 comes SW208)
function suggestNextBillNumber(){
  let best = null;
  for(const s of state.sales){
    const num = String(s.invoice_number||'').trim();
    const m = num.match(/^([A-Za-z]+)([-\s]?)(\d{1,6})$/);
    if(!m || /^(INV|WS|OFF)$/i.test(m[1])) continue;
    const t = new Date(s.sale_date||0).getTime() || 0;
    if(!best || t > best.t || (t === best.t && +m[3] > best.n)) best = {t, prefix:m[1], sep:m[2], n:+m[3], width:m[3].length};
  }
  if(!best) return 'SW001';
  return best.prefix + best.sep + String(best.n + 1).padStart(best.width, '0');
}
const inr2 = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
// The amount the customer pays (finalAmount) already includes GST. Taxable value = finalAmount / (1 + rate),
// so a bill reads: Subtotal - Discount = Taxable value, + GST = Total, and the total never changes.
function computeGst(finalAmount, ratePct, stateType){
  const r2 = (x) => Math.round((Number(x)||0)*100)/100;
  const F = r2(finalAmount), r = Number(ratePct)||0;
  const taxable = r > 0 ? r2(F / (1 + r/100)) : F;
  const tax = r2(F - taxable);
  const intra = stateType !== 'inter-state';
  const cgst = intra ? r2(tax/2) : 0;
  const sgst = intra ? r2(tax - cgst) : 0;
  const igst = intra ? 0 : tax;
  return {taxable, cgst, sgst, igst, tax};
}
// the lines that go under the item list on a bill: used by the POS cart and the printed invoice
function billTotalsHtml(b){ // b: {subtotal, taxable, cgst, sgst, igst, ratePct, stateType, total}
  const tax = (Number(b.cgst)||0) + (Number(b.sgst)||0) + (Number(b.igst)||0);
  const total = Number(b.total)||0, taxable = Number(b.taxable)||0;
  const subtotal = Math.max(Number(b.subtotal)||0, total);
  const discount = Math.round((subtotal - taxable)*100)/100;   // everything between the subtotal and the taxable value
  const line = (label, val, bold) => `<div class="cart-line" ${bold?'style="font-weight:700;font-size:15px;"':''}><span>${label}</span><span class="num">${val}</span></div>`;
  const rateLabel = b.ratePct ? ` (${Number(b.ratePct)}%)` : '';
  const halfLabel = b.ratePct ? ` (${Number(b.ratePct)/2}%)` : '';
  let html = '';
  if(discount > 0.005) html += line('Subtotal', inr2(subtotal)) + line('Discount', '-' + inr2(discount));
  if(tax > 0.005){
    html += line('Taxable value', inr2(taxable));
    html += b.stateType === 'inter-state'
      ? line('IGST' + rateLabel, inr2(b.igst))
      : line('CGST' + halfLabel, inr2(b.cgst)) + line('SGST' + halfLabel, inr2(b.sgst));
  }
  html += line('Total paid', inr2(total), true);
  return html;
}

// ====== DATA LOAD ======
async function loadAll(){
  try{
    const probe = await sb.from('products').select('hsn_code').limit(1);
    extrasAvailable = !probe.error;
    const [cats, prods, custs, sales, saleItems, team, company, wsAccounts, wsOrders, wsItems] = await Promise.all([
      sb.from('categories').select('*').order('name'),
      sb.from('products').select('*, product_images(image_url, is_primary)').order('created_at', {ascending:false}),
      sb.from('customers').select('*'),
      sb.from('sales').select('*').order('sale_date', {ascending:false}),
      sb.from('sale_items').select('*'),
      sb.from('team_members').select('*'),
      sb.from('company_settings').select('*').eq('id', 1).single(),
      sb.from('wholesale_accounts').select('*').order('shop_name'),
      sb.from('wholesale_orders').select('*').order('submitted_at', {ascending:false}),
      sb.from('wholesale_order_items').select('*'),
    ]);
    for(const r of [cats, prods, custs, sales, saleItems, team]){
      if(r.error) throw r.error;
    }
    state.categories = cats.data;
    state.products = prods.data.map(p => ({...p, image: (p.product_images && p.product_images[0]) ? p.product_images[0].image_url : null}));
    state.customers = custs.data;
    state.sales = sales.data;
    state.saleItems = saleItems.data;
    state.team = team.data;
    state.company = company.data || {company_name:'Swasole', address:'', phone:'', email:'', gstin:''};
    state.wholesaleAccounts = wsAccounts.data || [];
    state.wholesaleOrders = wsOrders.data || [];
    state.wholesaleOrderItems = wsItems.data || [];
    state.connError = null;
  }catch(e){
    console.error(e);
    state.connError = e.message || 'Could not reach the database.';
  }
  state.loaded = true;
  render();
}

function nav(route){ state.route = route; render(); }
function catName(id){ const c = state.categories.find(c=>c.category_id===id); return c ? c.name : '—'; }

function render(){
  renderSidebar(); renderMobileTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(!state.loaded){ main.innerHTML = '<div class="empty">Loading…</div>'; return; }
  if(state.connError){
    main.innerHTML = `<div class="statusbar err">Couldn't connect to Supabase: ${state.connError}</div>
      <p class="role-note">Check that the tables exist and the Row Level Security policies allow access, then reload this page.</p>`;
    return;
  }
  if(!extrasAvailable) main.insertAdjacentHTML('afterbegin', `<div class="statusbar err">A database update is waiting: run <strong>swasole-migration-6-billing.sql</strong> in Supabase to turn on HSN codes, MRP, GSTIN and the other new bill fields. Everything else keeps working meanwhile.</div>`);
  if(state.route === 'dashboard') renderDashboard(main);
  else if(state.route === 'pos') renderPOS(main);
  else if(state.route === 'orders') renderOrders(main);
  else if(state.route === 'bulkEdit') renderBulkEdit(main);
  else if(state.route === 'products') renderProducts(main);
  else if(state.route === 'customers') renderCustomers(main);
  else if(state.route === 'team') renderTeam(main);
  else if(state.route === 'company') renderCompany(main);
  else if(state.route === 'reports') renderReports(main);
  else if(state.route === 'wholesale') renderWholesale(main);
}
function renderSidebar(){
  document.getElementById('sidebar').innerHTML = `<div class="brand">Swasole</div>` +
    NAV.map(n => `<div class="navitem ${state.route===n.id?'active':''}" onclick="nav('${n.id}')">${n.label}</div>`).join('') +
    `<div class="navitem" style="margin-top:auto;color:var(--rose);" onclick="doLogout()">Log out</div><div style="padding:6px 24px 0;font-size:10px;color:var(--ink-soft);">Version ${APP_VERSION}</div>`;
}
function renderMobileTabs(){
  document.getElementById('mobileTabs').innerHTML = NAV.map(n => `<div class="navitem ${state.route===n.id?'active':''}" onclick="nav('${n.id}')">${n.label}</div>`).join('');
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }

// ================= PRODUCTS =================
let selectedProductIds = new Set();
let productFilter = 'all'; // all | online | offline
function renderProducts(main){
  main.innerHTML = `
    <div class="topbar">
      <h1>Products</h1>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="secondary" onclick="openCategoryModal()">Manage categories</button>
        <button class="secondary" onclick="openImportModal()">Import from Shopify</button>
        <button class="secondary" onclick="nav('bulkEdit')">Bulk edit pricing</button>
        <button class="gold" onclick="openProductModal()">+ Add product</button>
      </div>
    </div>
    <div class="filters">
      <div class="field"><label>Show</label>
        <select id="prodFilterSelect" onchange="productFilter=this.value; selectedProductIds.clear(); renderProducts(document.getElementById('main'))">
          <option value="all" ${productFilter==='all'?'selected':''}>All products</option>
          <option value="online" ${productFilter==='online'?'selected':''}>Online (on Shopify)</option>
          <option value="offline" ${productFilter==='offline'?'selected':''}>Offline (not on Shopify)</option>
        </select>
      </div>
    </div>
    <div id="bulkActionBar"></div>
    <table>
      <thead><tr><th></th><th></th><th>SKU</th><th>Name</th><th>Category</th><th class="num">Selling</th><th class="num">Stock</th><th>Listing</th><th>Status</th><th></th></tr></thead>
      <tbody id="productRows"></tbody>
    </table>`;
  const visible = state.products.filter(p => productFilter==='all' ? true : productFilter==='online' ? p.listed_on_shopify : !p.listed_on_shopify);
  const rows = document.getElementById('productRows');
  renderBulkActionBar();
  if(visible.length===0){ rows.innerHTML = `<tr><td colspan="10"><div class="empty">No products in this view.</div></td></tr>`; return; }
  rows.innerHTML = visible.map(p => `
    <tr>
      <td><input type="checkbox" ${selectedProductIds.has(p.product_id)?'checked':''} onchange="toggleProductSelect('${p.product_id}', this.checked)"></td>

function exportSelectedToShopifyCsv(){
  const ids = [...selectedProductIds];
  const rows = state.products.filter(p=>ids.includes(p.product_id));
  const header = ['Handle','Title','Body (HTML)','Vendor','Type','Tags','Published','Option1 Name','Option1 Value',
    'Variant SKU','Variant Price','Variant Inventory Qty','Variant Inventory Policy','Variant Fulfillment Service',
    'Image Src','Status'];
  const csvRows = rows.map(p=>{
    const handle = (p.name || p.sku).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || p.sku.toLowerCase();
    return [
      handle,
      p.name || '',
      p.description || '',
      state.company?.company_name || '',
      catName(p.category_id) || '',
      '',
      'TRUE',
      'Title',
      'Default Title',
      p.sku,
      p.selling_price,
      p.stock_qty,
      'deny',
      'manual',
      p.image || '',
      'active',
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = [header.join(','), ...csvRows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shopify-import-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  if(confirm(`Downloaded ${rows.length} product(s) as a Shopify import file. Mark these as "Online" now that you're uploading them?`)){
    markSelectedOnline(ids);
  }
}

let importRows = [];
function openImportModal(){
  openModal(`
    <h2>Import from Shopify</h2>
    <p class="role-note">Upload the CSV you exported from Shopify (Products → Export). We'll pull in name, SKU, stock, price, category, and photo — you fill in real purchase cost and margin per product afterward.</p>

    <div id="importPreview"></div>
  `);
}
function handleCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('importPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      importRows = buildImportRows(results.data);
      renderImportPreview();
    },
    error: (err) => { document.getElementById('importPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function buildImportRows(csvRows){
  let lastTitle = '', lastType = '', lastImage = '';
  const out = [];
  for(const row of csvRows){
    const title = (row['Title'] || '').trim();
    const type = (row['Type'] || '').trim();
    const image = (row['Image Src'] || '').trim();
    if(title) lastTitle = title;
    if(type) lastType = type;
    if(image) lastImage = image;
    const sku = (row['Variant SKU'] || '').trim();
    const price = parseFloat(row['Variant Price']);
    const qty = parseInt(row['Variant Inventory Qty']);
    const optionValue = (row['Option1 Value'] || '').trim();
    if(!sku && isNaN(price)) continue; // not a product/variant row
    if(isNaN(price)) continue;
    const name = (optionValue && optionValue.toLowerCase() !== 'default title') ? `${lastTitle} - ${optionValue}` : lastTitle;
    if(!name) continue;
    out.push({
      name,
      sku: sku || ('SW-'+Math.random().toString(36).slice(2,7).toUpperCase()),
      category: lastType || 'Uncategorized',
      price,
      stock: isNaN(qty) ? 0 : qty,
      image: lastImage || null,
      mrp: parseFloat(row['Variant Compare At Price']) || null,
    });
  }
  return out;
}
function renderImportPreview(){
  const el = document.getElementById('importPreview');
  if(importRows.length === 0){
    el.innerHTML = `<div class="empty">No products found in this file. Make sure it's the standard Shopify product export.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="role-note" style="margin:14px 0;">${importRows.length} product${importRows.length===1?'':'s'} found. Purchase price will be set equal to selling price and margin to 0% for now — edit each product afterward with real cost data.</div>
    <table><thead><tr><th>Name</th><th>SKU</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th></tr></thead>
    <tbody>${importRows.slice(0,8).map(r=>`<tr><td>${r.name}</td><td>${r.sku}</td><td>${r.category}</td><td class="num">${inr(r.price)}</td><td class="num">${r.stock}</td></tr>`).join('')}</tbody></table>
    ${importRows.length>8 ? `<div class="role-note" style="margin-top:8px;">…and ${importRows.length-8} more</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runImportBtn" onclick="runImport()">Import ${importRows.length} product${importRows.length===1?'':'s'}</button>
    </div>`;
}
async function runImport(){
  const btn = document.getElementById('runImportBtn');
  btn.disabled = true;
  let done = 0;
  for(const row of importRows){
    btn.textContent = `Importing ${done+1} of ${importRows.length}…`;
    let cat = state.categories.find(c=>c.name.toLowerCase() === row.category.toLowerCase());
    if(!cat){
      const {data, error} = await sb.from('categories').insert({name: row.category}).select().single();
      if(!error){ cat = data; state.categories.push(data); }
    }
    const {data: product, error: prodErr} = await sb.from('products').insert({
      sku: row.sku,
      name: row.name,
      category_id: cat ? cat.category_id : null,
      purchase_price: row.price,
      additional_charge_pct: 0,
      additional_charge_fixed: 0,
      margin_pct: 0,
      gst_rate: 3,
      stock_qty: row.stock,
      low_stock_threshold: 2,
      listed_on_shopify: true,
      mrp: row.mrp,
    }).select().single();
    if(!prodErr && row.image){
      await sb.from('product_images').insert({product_id: product.product_id, image_url: row.image, is_primary: true});
    }
    done++;
  }
  closeModal();
  await loadAll();
  alert(`Imported ${done} products. Remember to edit each one with real purchase cost and margin.`);
}

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = `<span class="role-note">Compressing photo…</span>`;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev) => { img.src = ev.target.result; };
  img.onload = () => {
    const MAX_DIM = 900; // long edge cap, keeps files small without visible quality loss for product photos
    let {width, height} = img;
    if(width > height && width > MAX_DIM){ height = Math.round(height * MAX_DIM/width); width = MAX_DIM; }
    else if(height > MAX_DIM){ width = Math.round(width * MAX_DIM/height); height = MAX_DIM; }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    const webpDataUrl = canvas.toDataURL('image/webp', 0.82);
    window._pendingImage = webpDataUrl;
    const kb = Math.round((webpDataUrl.length * 0.75) / 1024);
    preview.innerHTML = `<img src="${webpDataUrl}" style="width:70px;height:70px;object-fit:cover;"><div class="role-note">${width}×${height}px, ~${kb}KB (WebP)</div>`;
  };
  reader.readAsDataURL(file);
}
function previewPricing(){
  const purchase = parseFloat(document.getElementById('f_purchase').value)||0;
  const addlPct = parseFloat(document.getElementById('f_addlpct').value)||0;
  const addlFixed = parseFloat(document.getElementById('f_addlfixed').value)||0;
  const marginPct = parseFloat(document.getElementById('f_margin').value)||0;
  const landing = (purchase * (1+addlPct/100)) + addlFixed;
  const selling = landing * (1+marginPct/100);
  document.getElementById('pricingPreview').innerHTML = `Landing price: <strong>${inr(landing)}</strong> &nbsp;→&nbsp; Selling price: <strong>${inr(selling)}</strong> <br><span style="font-size:11px;">(the database recalculates these automatically on save)</span>`;
}

      <td><input type="number" value="${p.stock_qty}" style="width:70px;" oninput="bulkFieldChange('${p.product_id}','stock_qty',this.value,true)"></td>

function bulkFieldChange(productId, field, value, isRaw){
  if(!bulkEditChanges[productId]) bulkEditChanges[productId] = {};
  bulkEditChanges[productId][field] = isRaw ? value : (parseFloat(value)||0);
  if(field!=='purchase_price' && field!=='selling_price') return; // only these two affect the margin preview
  const p = state.products.find(p=>p.product_id===productId);
  const purchase = bulkEditChanges[productId].purchase_price ?? p.purchase_price;
  const selling = bulkEditChanges[productId].selling_price ?? p.selling_price;
  const marginEl = document.getElementById('margin_'+productId);
  marginEl.textContent = purchase>0 ? (((selling/purchase)-1)*100).toFixed(1)+'%' : '0.0%';
}
async function saveBulkEdits(){
  const ids = Object.keys(bulkEditChanges);
  if(ids.length===0){ alert('No changes to save.'); return; }
  const btn = document.getElementById('bulkSaveBtn');
  btn.disabled = true;
  let done = 0;
  for(const id of ids){
    btn.textContent = `Saving ${done+1} of ${ids.length}…`;
    const p = state.products.find(p=>p.product_id===id);
    const changes = bulkEditChanges[id];
    const updateData = {};
    if(changes.sku !== undefined) updateData.sku = changes.sku;
    if(changes.name !== undefined) updateData.name = changes.name;
    if(changes.category_id !== undefined) updateData.category_id = changes.category_id;
    if(changes.stock_qty !== undefined) updateData.stock_qty = changes.stock_qty;
    if(changes.gst_rate !== undefined) updateData.gst_rate = changes.gst_rate;
    if(changes.hsn_code !== undefined) updateData.hsn_code = String(changes.hsn_code).trim() || null;
    if(changes.mrp !== undefined) updateData.mrp = parseFloat(changes.mrp) || null;
    if(changes.purchase_price !== undefined || changes.selling_price !== undefined){
      const purchase = changes.purchase_price ?? p.purchase_price;
      const targetSelling = changes.selling_price ?? p.selling_price;
      // back-solve margin_pct so selling_price lands exactly on the target, with additional charges zeroed for simplicity
      updateData.purchase_price = purchase;
      updateData.additional_charge_pct = 0;
      updateData.additional_charge_fixed = 0;
      updateData.margin_pct = purchase>0 ? ((targetSelling/purchase)-1)*100 : 0;
    }
    const {data: updated, error} = await sb.from('products').update(updateData).eq('product_id', id).select().single();
    if(error){ alert(`Could not save ${p.sku}: ${error.message}`); continue; }
    if(updated && (changes.purchase_price !== undefined || changes.selling_price !== undefined)){
      // refresh cost snapshot on already-recorded bills for this product so profit KPIs reflect the corrected cost
      await sb.from('sale_items').update({landing_price_snapshot: updated.landing_price}).eq('product_id', id);
    }
    done++;
  }
  bulkEditChanges = {};
  await loadAll();
  nav('bulkEdit');
  alert(`Saved changes for ${done} products.`);
}

// ---------- AUTO-ESTIMATE PURCHASE PRICE FROM MARKUP RATIO ----------
function placeholderProducts(){
  // products where purchase price still equals selling price — i.e. real cost was never entered
  return state.products.filter(p => Number(p.purchase_price) === Number(p.selling_price));
}
function openAutoEstimateModal(){
  const targets = placeholderProducts();
  openModal(`
    <h2>Auto-estimate purchase price</h2>
    <p class="role-note">Applies to the ${targets.length} product${targets.length===1?'':'s'} that still show purchase price = selling price (i.e. real cost not yet entered). Products you've already corrected are left untouched.</p>
    <div class="field" style="margin-top:16px;"><label>Your usual markup — selling price is about this many times your cost</label>
      <input type="number" id="markupRatio" value="4.4" step="0.1">
    </div>
    <p class="role-note" id="markupPreview"></p>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runEstimateBtn" onclick="runAutoEstimate()">Apply estimate to ${targets.length} products</button>
    </div>
  `);
  document.getElementById('markupRatio').addEventListener('input', updateMarkupPreview);
  updateMarkupPreview();
}
function updateMarkupPreview(){
  const ratio = parseFloat(document.getElementById('markupRatio').value) || 1;
  const sample = placeholderProducts()[0];
  if(sample){
    const est = sample.selling_price / ratio;
    document.getElementById('markupPreview').textContent = `Example: "${sample.name}" sells at ${inr(sample.selling_price)} → estimated purchase price ${inr(est)}.`;
  }
}
async function runAutoEstimate(){
  const ratio = parseFloat(document.getElementById('markupRatio').value);
  if(!ratio || ratio<=1){ alert('Enter a markup greater than 1 (e.g. 4 means you sell at 4x cost).'); return; }
  const targets = placeholderProducts();
  const btn = document.getElementById('runEstimateBtn');
  btn.disabled = true;
  const marginPct = (ratio-1)*100;
  let done = 0;
  for(const p of targets){
    btn.textContent = `Estimating ${done+1} of ${targets.length}…`;
    const estimatedPurchase = Math.round((p.selling_price / ratio) * 100) / 100;
    const {data: updated} = await sb.from('products').update({
      purchase_price: estimatedPurchase,
      additional_charge_pct: 0,
      additional_charge_fixed: 0,
      margin_pct: marginPct,
    }).eq('product_id', p.product_id).select().single();
    if(updated){
      await sb.from('sale_items').update({landing_price_snapshot: updated.landing_price}).eq('product_id', p.product_id);
    }
    done++;
  }
  closeModal();
  await loadAll();
  nav('bulkEdit');
  alert(`Estimated purchase price for ${done} products using a ${ratio}x markup. Go through Bulk Edit and correct any that are actually different.`);
}

// ---------- CUSTOMER CSV IMPORT ----------
let custImportRows = [];
function openCustomerImportModal(){
  openModal(`
    <h2>Import customers</h2>
    <p class="role-note">Works with a Shopify customer export, or any CSV with Name/Phone/Email/City/Address columns (column names are matched flexibly).</p>
    <div class="field" style="margin-top:16px;"><input type="file" accept=".csv" onchange="handleCustCsvUpload(event)"></div>
    <div id="custImportPreview"></div>
  `);
}
function findCol(row, candidates){
  for(const key of Object.keys(row)){
    if(candidates.some(c => key.toLowerCase().trim() === c)) return row[key];
  }
  return '';
}
function handleCustCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('custImportPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: (results) => {
      custImportRows = results.data.map(row => {
        let name = findCol(row, ['name','customer name','full name']);
        if(!name){
          const first = findCol(row, ['first name']);
          const last = findCol(row, ['last name']);
          name = [first, last].filter(Boolean).join(' ');
        }
        return {
          name: (name||'').trim(),
          phone: findCol(row, ['phone','phone number','default address phone']).trim(),
          email: findCol(row, ['email']).trim(),
          city: findCol(row, ['city','default address city']).trim(),
          address: findCol(row, ['address','address1','default address address1']).trim(),
        };
      }).filter(r => r.name);
      renderCustImportPreview();
    },
    error: (err) => { document.getElementById('custImportPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function renderCustImportPreview(){
  const el = document.getElementById('custImportPreview');
  if(custImportRows.length === 0){ el.innerHTML = `<div class="empty">No customer rows found — check the file has a Name column.</div>`; return; }
  el.innerHTML = `
    <div class="role-note" style="margin:14px 0;">${custImportRows.length} customers found. Existing phone numbers will be skipped to avoid duplicates.</div>
    <table><thead><tr><th>Name</th><th>Phone</th><th>City</th></tr></thead>
    <tbody>${custImportRows.slice(0,8).map(r=>`<tr><td>${r.name}</td><td>${r.phone||'—'}</td><td>${r.city||'—'}</td></tr>`).join('')}</tbody></table>
    ${custImportRows.length>8 ? `<div class="role-note" style="margin-top:8px;">…and ${custImportRows.length-8} more</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runCustImportBtn" onclick="runCustomerImport()">Import ${custImportRows.length} customers</button>
    </div>`;
}
async function runCustomerImport(){
  const btn = document.getElementById('runCustImportBtn');
  btn.disabled = true;
  let done = 0, skipped = 0;
  for(const r of custImportRows){
    btn.textContent = `Importing ${done+skipped+1} of ${custImportRows.length}…`;
    if(r.phone && state.customers.some(c=>c.phone===r.phone)){ skipped++; continue; }
    const {error} = await sb.from('customers').insert({name:r.name, phone:r.phone, email:r.email, city:r.city, address:r.address});
    if(!error) done++; else skipped++;
  }
  closeModal();
  await loadAll();
  alert(`Imported ${done} customers${skipped>0 ? `, skipped ${skipped} (duplicates or errors)` : ''}.`);
}

// ---------- invoice totals + one-time GST tidy-up for older bills ----------
function saleTaxAmount(s){ return (Number(s.cgst_amount)||0) + (Number(s.sgst_amount)||0) + (Number(s.igst_amount)||0); }
function invoiceTotalsHtml(s){
  const g = newGstFor(s);   // worked out from the amount paid, so every bill reads the same way
  return billTotalsHtml({subtotal: s.subtotal_before_discount, taxable: g.taxable, cgst: g.cgst, sgst: g.sgst, igst: g.igst,
    ratePct: g.rate, stateType: s.state_type, total: s.final_amount});
}
function newGstFor(s){
  const tax = saleTaxAmount(s), taxable = Number(s.taxable_value)||0;
  let rate;
  if(tax > 0.005 && taxable > 0){
    rate = tax/taxable*100;                                   // keep the rate the bill already used
    const snap = Math.round(rate*4)/4;                         // tidy 3.008 -> 3
    rate = Math.abs(rate - snap) < 0.1 ? snap : Math.round(rate*100)/100;
  }else{                                                       // bill had no GST recorded: use the items' own rates (default 3%)
    const items = state.saleItems.filter(i => i.sale_id === s.sale_id);
    const sum = items.reduce((a,i)=>a+Number(i.line_total),0);
    const w = items.reduce((a,i)=>{ const p = state.products.find(p=>p.product_id===i.product_id); return a + (p ? Number(p.gst_rate) : 3) * Number(i.line_total); },0);
    rate = sum>0 ? Math.round(w/sum*100)/100 : 3;
  }
  const g = computeGst(s.final_amount, rate, s.state_type);
  g.rate = rate;
  return g;
}
function saleNeedsGstTidy(s){
  const g = newGstFor(s);
  // a difference of one paisa (rounding) is not worth flagging
  return Math.abs(g.taxable - Number(s.taxable_value)) > 0.011 || Math.abs(g.cgst - Number(s.cgst_amount)) > 0.011 ||
         Math.abs(g.sgst - Number(s.sgst_amount)) > 0.011 || Math.abs(g.igst - Number(s.igst_amount)) > 0.011;
}
function salesNeedingGstTidy(){ return state.sales.filter(saleNeedsGstTidy); }
async function tidyOneBill(saleId){
  const s = state.sales.find(x=>x.sale_id===saleId);
  const g = newGstFor(s);
  const {error} = await sb.from('sales').update({taxable_value: g.taxable, cgst_amount: g.cgst, sgst_amount: g.sgst, igst_amount: g.igst}).eq('sale_id', saleId);
  if(error){ alert('Could not update this bill: ' + error.message); return; }
  await loadAll();
  state.route = 'orders'; render();
  openOrderDetail(saleId);
}
async function tidyGstOnExistingBills(){
  const targets = salesNeedingGstTidy();
  if(targets.length === 0){ alert('All your bills already use the new GST layout.'); return; }
  const s0 = targets[0], g0 = newGstFor(s0);
  const backTo = state.route;
  if(!confirm(`Update the saved GST figures on ${targets.length} existing bill${targets.length>1?'s':''}?\n\n` +
    `Bill totals and customers do NOT change. Only the tax lines change — for example ${s0.invoice_number}: total stays ${inr2(s0.final_amount)}, ` +
    `taxable value becomes ${inr2(g0.taxable)} and GST becomes ${inr2(g0.tax)} (it was ${inr2(saleTaxAmount(s0))}, taxable ${inr2(s0.taxable_value)}).\n\n` +
    `The GST figures in Reports and the CSV export will change to match. Continue?`)) return;
  const btn = document.getElementById('tidyGstBtn'); if(btn){ btn.disabled = true; }
  let done = 0, failed = 0;
  for(const s of targets){
    if(btn) btn.textContent = `Updating ${done+failed+1} of ${targets.length}…`;
    const g = newGstFor(s);
    const {error} = await sb.from('sales').update({taxable_value: g.taxable, cgst_amount: g.cgst, sgst_amount: g.sgst, igst_amount: g.igst}).eq('sale_id', s.sale_id);
    if(error) failed++; else done++;
  }
  closeModal();
  await loadAll();
  nav(backTo);
  alert(`Updated ${done} bill${done===1?'':'s'}.${failed ? ' ' + failed + ' could not be updated.' : ''}`);
}

let pendingRestoreData = null;
function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      pendingRestoreData = JSON.parse(ev.target.result);
      const counts = Object.entries(pendingRestoreData).filter(([k,v])=>Array.isArray(v)).map(([k,v])=>`${k}: ${v.length}`).join(', ');
      document.getElementById('restorePreview').innerHTML = `
        <p class="role-note" style="margin:10px 0;">Backup from ${pendingRestoreData.exported_at||'unknown date'} for ${pendingRestoreData.company||'—'}.<br>${counts}</p>
        <button class="gold" id="runRestoreBtn" onclick="runRestore()">Restore this data now</button>`;
    }catch(err){
      document.getElementById('restorePreview').innerHTML = `<div class="statusbar err">Could not read file: ${err.message}</div>`;
    }
  };
  reader.readAsText(file);
}
async function runRestore(){
  if(!pendingRestoreData) return;
  const btn = document.getElementById('runRestoreBtn');
  btn.disabled = true;
  // order matters: parents before children, to satisfy foreign keys
  const order = ['categories','suppliers','products','product_images','customers','team_members',
    'sales','sale_items','purchases','purchase_items','inventory_transactions',
    'wholesale_accounts','wholesale_orders','wholesale_order_items'];
  let log = [];
  for(const table of order){
    const rows = pendingRestoreData[table];
    if(!rows || rows.length===0) continue;
    btn.textContent = `Restoring ${table}…`;
    const {error} = await sb.from(table).insert(rows);
    log.push(`${table}: ${error ? 'FAILED — '+error.message : rows.length+' rows restored'}`);
  }
  // company_settings is special: the migration script already seeds id=1, so update rather than insert
  if(pendingRestoreData.company_settings && pendingRestoreData.company_settings[0]){
    const {id, ...rest} = pendingRestoreData.company_settings[0];
    const {error} = await sb.from('company_settings').update(rest).eq('id', 1);
    log.push(`company_settings: ${error ? 'FAILED — '+error.message : 'restored'}`);
  }
  btn.disabled = false;
  btn.textContent = 'Restore this data now';
  await loadAll();
  alert('Restore finished:\n\n' + log.join('\n'));
}
async function downloadFullBackup(){
  const btn = document.getElementById('backupBtn');
  btn.disabled = true; btn.textContent = 'Preparing backup…';
  try{
    const tables = ['categories','products','product_images','customers','sales','sale_items','team_members',
      'company_settings','suppliers','purchases','purchase_items','inventory_transactions',
      'wholesale_accounts','wholesale_orders','wholesale_order_items'];
    const results = await Promise.all(tables.map(t => sb.from(t).select('*')));
    const backup = {exported_at: new Date().toISOString(), company: state.company?.company_name || ''};
    tables.forEach((t,i) => { backup[t] = results[i].data || []; });
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `swasole-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Backup failed: '+e.message);
  }
  btn.disabled = false; btn.textContent = 'Download full data backup';
}
async function applyHsnToAll(){
  if(!extrasAvailable){ alert('Please run swasole-migration-6-billing.sql in Supabase first. HSN codes cannot be saved until that is done.'); return; }
  const code = document.getElementById('bulkHsn').value.trim();
  if(!code){ alert('Enter an HSN code first.'); return; }
  const prods = state.products.filter(p => (p.hsn_code||'') !== code);
  const lines = state.saleItems.filter(i => (i.hsn_code||'') !== code);
  if(!confirm(`Set HSN ${code} on:\n\n• ${prods.length} of ${state.products.length} products\n• ${lines.length} bill lines on existing bills\n• and as the default for new products\n\nBill totals and tax amounts do not change. Continue?`)) return;
  const btn = document.getElementById('applyHsnBtn'); btn.disabled = true; btn.textContent = 'Updating…';
  let failed = 0;
  const {error: ce} = await sb.from('company_settings').update({default_hsn: code}).eq('id', 1);
  if(ce) failed++;
  const chunk = (arr, n) => { const out = []; for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n)); return out; };
  for(const part of chunk(prods.map(p=>p.product_id), 50)){
    btn.textContent = 'Updating products…';
    const {error} = await sb.from('products').update({hsn_code: code}).in('product_id', part);
    if(error) failed++;
  }
  for(const part of chunk(lines.map(i=>i.sale_item_id), 50)){
    btn.textContent = 'Updating bills…';
    const {error} = await sb.from('sale_items').update({hsn_code: code}).in('sale_item_id', part);
    if(error) failed++;
  }
  await loadAll();
  nav('company');
  alert(failed ? 'Some updates failed, please try again.' : `Done. HSN ${code} is now on ${prods.length} products and ${lines.length} bill lines.`);
}

async function cancelWholesaleOrder(orderId){
  if(!confirm('Cancel this order request?')) return;
  await sb.from('wholesale_orders').update({status:'cancelled'}).eq('wholesale_order_id', orderId);
  closeModal(); await loadAll(); nav('wholesale');
}
async function fulfillWholesaleOrder(orderId){
  const o = state.wholesaleOrders.find(o=>o.wholesale_order_id===orderId);
  const acc = state.wholesaleAccounts.find(a=>a.account_id===o.account_id);
  const items = state.wholesaleOrderItems.filter(i=>i.wholesale_order_id===orderId);
  if(items.some(i=>{ const p = state.products.find(p=>p.product_id===i.product_id); return !p || p.stock_qty < i.quantity; })){
    if(!confirm('Some items may not have enough stock. Fulfill anyway?')) return;
  }
  const subtotal = items.reduce((s,i)=>s+i.quantity*i.wholesale_unit_price,0);
  const gstWeighted = items.reduce((s,i)=>{ const p = state.products.find(p=>p.product_id===i.product_id); return s + (p?p.gst_rate:3) * i.quantity*i.wholesale_unit_price; },0);
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 3;
  const g = computeGst(subtotal, avgGst, 'intra-state');
  const {data: sale, error: saleErr} = await sb.from('sales').insert({
    invoice_number: 'WS-' + Date.now().toString().slice(-8),
    customer_id: null,
    channel: 'wholesale',
    subtotal_before_discount: subtotal, discount_value: 0, final_amount: subtotal,
    taxable_value: g.taxable, cgst_amount: g.cgst, sgst_amount: g.sgst, igst_amount: g.igst,
    state_type: 'intra-state', payment_method: 'Wholesale — ' + (acc?acc.shop_name:''),
  }).select().single();
  if(saleErr){ alert('Could not create bill: '+saleErr.message); return; }
  const saleItemsData = items.map(i=>{
    const p = state.products.find(p=>p.product_id===i.product_id);
    return {sale_id: sale.sale_id, product_id: i.product_id, item_name: p?p.name:'Product', quantity: i.quantity, unit_price: i.wholesale_unit_price, landing_price_snapshot: p?p.landing_price:0, line_total: i.quantity*i.wholesale_unit_price, hsn_code: p ? (hsnFor(p) || null) : null, mrp: p ? (mrpFor(p) || null) : null};
  });
  await sb.from('sale_items').insert(saleItemsData);
  const invTxns = items.map(i=>({product_id: i.product_id, type:'sale_out', quantity: -i.quantity, reference_id: sale.sale_id, channel:'wholesale'}));
  await sb.from('inventory_transactions').insert(invTxns);
  for(const i of items){
    const p = state.products.find(p=>p.product_id===i.product_id);
    if(p) await sb.from('products').update({stock_qty: p.stock_qty - i.quantity}).eq('product_id', i.product_id);
  }
  await sb.from('wholesale_orders').update({status:'fulfilled', fulfilled_sale_id: sale.sale_id}).eq('wholesale_order_id', orderId);
  closeModal();
  await loadAll();
  nav('wholesale');
  alert('Order fulfilled and billed as ' + sale.invoice_number + '. Stock has been updated.');
}

  const el = document.getElementById('cartLines');
  if(!el) return;
  if(cart.length===0){ el.innerHTML = `<div class="empty">Cart is empty.</div>`; return; }
  el.innerHTML = cart.map((l,i)=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="display:flex;justify-content:space-between;gap:8px;"><strong style="font-size:13px;">${esc(p.name)}</strong><button class="small secondary" onclick="removeLine(${i})">×</button></div>

function updateQty(i, val){ cart[i].qty = Math.max(1, parseInt(val)||1); renderCartLines(); renderCartTotals(); }
function updateRate(i, val){ cart[i].rate = Math.max(0, parseFloat(val)||0); renderCartLines(); renderCartTotals(); }
function removeLine(i){ cart.splice(i,1); renderCartLines(); renderCartTotals(); }
function computeTotals(){
  const subtotal = cart.reduce((a,l)=> a + l.rate*l.qty, 0);
  const discount = parseFloat(document.getElementById('posDiscount')?.value)||0;
  const finalAmount = Math.max(0, subtotal - discount);
  let gstWeighted = 0;
  cart.forEach(l=>{ const p = state.products.find(p=>p.product_id===l.productId); gstWeighted += (Number(p.gst_rate) * l.rate*l.qty); });
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 0;
  const stateType = document.getElementById('posStateType')?.value || 'intra-state';
  const g = computeGst(finalAmount, avgGst, stateType);
  return {subtotal, discount, finalAmount, taxable: g.taxable, cgst: g.cgst, sgst: g.sgst, igst: g.igst, stateType, ratePct: avgGst};
}
function renderCartTotals(){
  const el = document.getElementById('cartTotals');
  if(!el) return;
  const t = computeTotals();
  el.innerHTML = billTotalsHtml({subtotal:t.subtotal, discount:t.discount, taxable:t.taxable, cgst:t.cgst, sgst:t.sgst, igst:t.igst,
    ratePct:Math.round(t.ratePct*100)/100, stateType:t.stateType, total:t.finalAmount});
}
async function completeSale(){
  if(cart.length===0){ alert('Cart is empty'); return; }
  const invoiceNo = document.getElementById('posInvoice').value.trim();
  if(!invoiceNo){ alert('Please enter a bill number.'); return; }
  if(state.sales.some(s => String(s.invoice_number||'').toUpperCase() === invoiceNo.toUpperCase())){ alert('That bill number is already used. Please pick another one.'); return; }
  const dateStr = document.getElementById('posDate').value;
  if(!dateStr){ alert('Please pick a date.'); return; }
  const btn = document.getElementById('completeSaleBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  // find-or-create customer from inline fields
  const custName = document.getElementById('posCustName').value.trim();
  const custPhone = document.getElementById('posCustPhone').value.trim();
  const custAddress = document.getElementById('posCustAddress').value.trim();
  const custGstin = document.getElementById('posCustGstin').value.trim().toUpperCase();
  let customerId = null;
  if(custName){
    let existing = custPhone ? state.customers.find(c=>c.phone===custPhone) : state.customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
    if(existing){
      customerId = existing.customer_id;
      const patch = {name:custName, phone:custPhone||existing.phone, address:custAddress||existing.address};
      if(custGstin) patch.gstin = custGstin;
      await sb.from('customers').update(patch).eq('customer_id', customerId);
    }else{
      const {data: newCust, error: custErr} = await sb.from('customers').insert({name:custName, phone:custPhone, address:custAddress, gstin:custGstin}).select().single();
      if(!custErr) customerId = newCust.customer_id;
    }
  }

  const t = computeTotals();
  const today = localDateStr(new Date());
  const saleDate = dateStr === today ? new Date().toISOString() : new Date(+dateStr.slice(0,4), +dateStr.slice(5,7)-1, +dateStr.slice(8,10), 12).toISOString();
  const saleRow = {
    invoice_number: invoiceNo,
    customer_id: customerId,
    channel: 'store',
    sale_date: saleDate,
    subtotal_before_discount: t.subtotal, discount_value: t.discount, final_amount: t.finalAmount,
    taxable_value: t.taxable, cgst_amount: t.cgst, sgst_amount: t.sgst, igst_amount: t.igst,
    state_type: t.stateType, payment_method: document.getElementById('posPayment').value,
    buyer_gstin: custGstin || null, place_of_supply: document.getElementById('posPlace').value.trim() || null,
    notes: document.getElementById('posNotes').value.trim() || null,
  };
  const {data: sale, error: saleErr} = await sb.from('sales').insert(saleRow).select().single();
  if(saleErr){ alert('Could not save sale: '+saleErr.message); btn.disabled=false; btn.textContent='Complete sale'; return; }

  const items = cart.map(l=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return {sale_id: sale.sale_id, product_id: p.product_id, item_name: p.name, quantity: l.qty, unit_price: l.rate,
      landing_price_snapshot: p.landing_price, line_total: l.rate*l.qty, hsn_code: hsnFor(p) || null, mrp: mrpFor(p) || null};
  });
  const {error: itemsErr} = await sb.from('sale_items').insert(items);
  if(itemsErr){ alert('Sale saved but items failed: '+itemsErr.message); }

  const invTxns = cart.map(l => ({product_id: l.productId, type:'sale_out', quantity: -l.qty, reference_id: sale.sale_id, channel:'store'}));
  await sb.from('inventory_transactions').insert(invTxns);

  for(const l of cart){
    const p = state.products.find(p=>p.product_id===l.productId);
    await sb.from('products').update({stock_qty: p.stock_qty - l.qty}).eq('product_id', p.product_id);
  }

  cart = [];
  await loadAll();
  state.route = 'orders';
  render();
  openOrderDetail(sale.sale_id);
}
