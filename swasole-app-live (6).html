function editBillLine(i, field, value){
  const l = editBill.lines[i];
  if(field==='name'){
    const text = String(value||'').trim();
    const p = text ? matchProductForItem({sku:text, name:text}) : null;
    l.item_name = p ? p.name : text;
    l.product_id = p ? p.product_id : null;
    if(p){ l.landing = Number(p.landing_price)||0; if(!l.unit) l.unit = Number(p.selling_price)||0; l.hsn = hsnFor(p) || l.hsn; l.mrp = mrpFor(p); }
    editBillRows();
  }else if(field==='qty'){ l.qty = Math.max(0, parseFloat(value)||0); }
  else if(field==='unit'){ l.unit = parseFloat(value)||0; }
  else if(field==='hsn'){ l.hsn = String(value||'').trim(); }
  else if(field==='mrp'){ l.mrp = parseFloat(value)||0; }
  const cell = document.getElementById('ebLineTotal_'+i); if(cell) cell.textContent = inr2(l.qty*l.unit);
  editBillRecalc();
}
function editBillAdd(){ editBill.lines.push({product_id:null, item_name:'', qty:1, unit:0, landing:0, hsn:'', mrp:0}); editBillRows(); editBillRecalc(); }
function editBillRemove(i){ editBill.lines.splice(i,1); editBillRows(); editBillRecalc(); }
function editBillCalc(){
  const subtotal = editBill.lines.reduce((a,l)=>a+l.qty*l.unit,0);
  const discount = Math.min(Math.max(parseFloat(document.getElementById('eb_discount').value)||0,0), subtotal);
  const final = Math.round((subtotal - discount)*100)/100;
  const stateType = document.getElementById('eb_state').value;
  const rate = Math.round(editBillRate()*100)/100;
  const g = computeGst(final, rate, stateType);
  return {subtotal, discount, final, stateType, rate, g};
}
function editBillRecalc(){
  const t = editBillCalc();
  document.getElementById('ebTotals').innerHTML = billTotalsHtml({subtotal:t.subtotal, discount:t.discount, taxable:t.g.taxable, cgst:t.g.cgst, sgst:t.g.sgst, igst:t.g.igst, ratePct:t.rate, stateType:t.stateType, total:t.final});
}
async function saveEditedBill(){
  const saleId = editBill.saleId;
  const s = state.sales.find(x=>x.sale_id===saleId);
  const invoice = document.getElementById('eb_invoice').value.trim();
  const dateStr = document.getElementById('eb_date').value;
  if(!invoice){ alert('Bill number cannot be empty.'); return; }
  if(state.sales.some(o => o.sale_id!==saleId && String(o.invoice_number||'').toUpperCase()===invoice.toUpperCase())){ alert('That bill number is already used on another bill.'); return; }
  if(!dateStr){ alert('Please pick a date.'); return; }
  const lines = editBill.lines.filter(l => (l.item_name||'').trim() || l.qty>0);
  if(lines.length===0 || lines.some(l => !(l.item_name||'').trim() || !(l.qty>0))){ alert('Every item needs a name and a quantity above 0.'); return; }
  const t = editBillCalc();
  const btn = document.getElementById('ebSaveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  const fail = (msg) => { alert(msg); btn.disabled = false; btn.textContent = 'Save changes'; };

  // customer: keep the same record, switch to another existing one, or create a new one
  const cname = document.getElementById('eb_cname').value.trim(), cphone = document.getElementById('eb_cphone').value.trim(), caddr = document.getElementById('eb_caddr').value.trim();
  const cgstin = document.getElementById('eb_gstin').value.trim().toUpperCase();
  let customerId = null;
  if(cname){
    const existing = state.customers.find(c => String(c.name||'').trim().toLowerCase() === cname.toLowerCase());
    if(existing){
      customerId = existing.customer_id;
      const patch = {}; if(cphone && cphone!==existing.phone) patch.phone = cphone; if(caddr && caddr!==existing.address) patch.address = caddr;
      if(cgstin && cgstin!==existing.gstin) patch.gstin = cgstin;
      if(Object.keys(patch).length) await sb.from('customers').update(patch).eq('customer_id', customerId);
    }else{
      const {data: nc, error: ce} = await sb.from('customers').insert({name: cname, phone: cphone, address: caddr, gstin: cgstin}).select().single();
      if(ce){ fail('Could not save the customer: ' + ce.message); return; }
      customerId = nc.customer_id;
    }
  }

  // 1) add the new item rows first, so nothing is lost if this step fails
  const oldItems = state.saleItems.filter(i=>i.sale_id===saleId);
  const newRows = lines.map(l => ({sale_id: saleId, product_id: l.product_id, item_name: l.item_name, quantity: l.qty, unit_price: l.unit,
    landing_price_snapshot: l.product_id ? (l.landing || l.unit) : l.unit, line_total: Math.round(l.qty*l.unit*100)/100,
    hsn_code: l.hsn || null, mrp: l.mrp || null}));
  const {data: inserted, error: insErr} = await sb.from('sale_items').insert(newRows).select();
  if(insErr){ fail('Could not save the items: ' + insErr.message); return; }

  // 2) update the bill itself
  const saleDate = dateStr === editBill.origDate ? editBill.origSaleDate : new Date(+dateStr.slice(0,4), +dateStr.slice(5,7)-1, +dateStr.slice(8,10), 12).toISOString();
  const {error: upErr} = await sb.from('sales').update({
    invoice_number: invoice, sale_date: saleDate, customer_id: customerId, channel: document.getElementById('eb_channel').value,
    payment_method: document.getElementById('eb_payment').value.trim(), state_type: t.stateType,
    subtotal_before_discount: t.subtotal, discount_value: t.discount, final_amount: t.final,
    taxable_value: t.g.taxable, cgst_amount: t.g.cgst, sgst_amount: t.g.sgst, igst_amount: t.g.igst,
    buyer_gstin: cgstin || null, place_of_supply: document.getElementById('eb_place').value.trim() || null,
    notes: document.getElementById('eb_notes').value.trim() || null,
  }).eq('sale_id', saleId);
  if(upErr){
    for(const r of (inserted||[])) await sb.from('sale_items').delete().eq('sale_item_id', r.sale_item_id);
    fail('Could not save the bill: ' + upErr.message); return;
  }

  // 3) remove the old item rows
  for(const o of oldItems) await sb.from('sale_items').delete().eq('sale_item_id', o.sale_item_id);

  // 4) stock: only if this bill had actually taken stock out
  const {data: txns} = await sb.from('inventory_transactions').select('*').eq('reference_id', saleId);
  const outTxns = (txns||[]).filter(x=>x.type==='sale_out');
  if(outTxns.length){
    const oldMap = {}, newMap = {};
    outTxns.forEach(x => { oldMap[x.product_id] = (oldMap[x.product_id]||0) + Math.abs(Number(x.quantity)); });
    lines.forEach(l => { if(l.product_id) newMap[l.product_id] = (newMap[l.product_id]||0) + l.qty; });
    for(const pid of new Set([...Object.keys(oldMap), ...Object.keys(newMap)])){
      const delta = (newMap[pid]||0) - (oldMap[pid]||0);
      const p = state.products.find(p=>p.product_id===pid);
      if(delta!==0 && p){ p.stock_qty = Number(p.stock_qty) - delta; await sb.from('products').update({stock_qty: p.stock_qty}).eq('product_id', pid); }
    }
    for(const x of outTxns) await sb.from('inventory_transactions').delete().eq('transaction_id', x.transaction_id);
    const channel = document.getElementById('eb_channel').value;
    const fresh = Object.entries(newMap).map(([pid,q]) => ({product_id: pid, type:'sale_out', quantity: -q, reference_id: saleId, channel}));
    if(fresh.length) await sb.from('inventory_transactions').insert(fresh);
  }

  closeModal();
  await loadAll();
  state.route = 'orders'; render();
  openOrderDetail(saleId);
}

async function deleteOrder(saleId){
  if(!confirm('Delete this bill?\n\nIf this bill took items out of your stock, they go back into stock. Bills that never changed your stock (for example imported past bills) leave stock alone.')) return;
  // only put stock back where the bill actually took it out
  const {data: txns} = await sb.from('inventory_transactions').select('*').eq('reference_id', saleId);
  for(const t of (txns||[]).filter(t=>t.type==='sale_out')){
    const p = state.products.find(p=>p.product_id===t.product_id);
    if(p) await sb.from('products').update({stock_qty: p.stock_qty + Math.abs(Number(t.quantity))}).eq('product_id', p.product_id);
  }
  await sb.from('inventory_transactions').delete().eq('reference_id', saleId);
  await sb.from('sale_items').delete().eq('sale_id', saleId);
  await sb.from('sales').delete().eq('sale_id', saleId);
  closeModal();
  await loadAll();
  state.route = 'orders';
  render();
}

// ---------- ORDERS CSV IMPORT (Shopify order export) ----------
let orderImportGroups = [];
function openOrderImportModal(){
  openModal(`
    <h2>Import past orders from Shopify</h2>
    <p class="role-note">Adds historical orders to your sales records for reporting. <strong>Stock is NOT changed</strong> — your current stock already reflects these past sales. GST is approximated as an even CGST/SGST split from Shopify's total tax, since Shopify doesn't export the exact breakdown. Line items whose SKU doesn't match a product here will be skipped.</p>
    <div class="field" style="margin-top:16px;"><input type="file" accept=".csv" onchange="handleOrderCsvUpload(event)"></div>
    <div id="orderImportPreview"></div>
  `);
}
function handleOrderCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('orderImportPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: (results) => { orderImportGroups = buildOrderGroups(results.data); renderOrderImportPreview(); },
    error: (err) => { document.getElementById('orderImportPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function buildOrderGroups(csvRows){
  const groups = {};
  let lastOrderName = '';
  for(const row of csvRows){
    const orderName = (findCol(row, ['name','order','order name']) || '').trim() || lastOrderName;
    if(!orderName) continue;
    lastOrderName = orderName;
    if(!groups[orderName]){
      const addr1 = findCol(row, ['billing address1','shipping address1']).trim();
      const city = findCol(row, ['billing city','shipping city']).trim();
      groups[orderName] = {
        orderName,
        email: findCol(row, ['email']).trim(),
        phone: findCol(row, ['phone','billing phone','shipping phone']).trim(),
        custName: findCol(row, ['billing name','shipping name']).trim(),
        address: [addr1, city].filter(Boolean).join(', '),
        total: parseFloat(findCol(row, ['total'])) || 0,
        taxes: parseFloat(findCol(row, ['taxes'])) || 0,
        discount: parseFloat(findCol(row, ['discount amount'])) || 0,
        createdAt: findCol(row, ['created at','paid at']) || new Date().toISOString(),
        financialStatus: findCol(row, ['financial status']).trim(),
        items: [],
      };
    }
    const sku = findCol(row, ['lineitem sku']).trim();
    const name = findCol(row, ['lineitem name']).trim();
    const qty = parseInt(findCol(row, ['lineitem quantity'])) || 0;
    const price = parseFloat(findCol(row, ['lineitem price']));
    if((sku || name) && qty && !isNaN(price)){
      groups[orderName].items.push({sku, name, qty, price});
    }
  }
  return Object.values(groups).filter(g => g.items.length > 0 && g.total > 0);
}
function matchProductForItem(it){
  if(it.sku){
    const bySku = state.products.find(p => p.sku.trim().toLowerCase() === it.sku.trim().toLowerCase());
    if(bySku) return bySku;
  }
  if(it.name){
    const byName = state.products.find(p => p.name.trim().toLowerCase() === it.name.trim().toLowerCase());
    if(byName) return byName;
  }
  return null;
}
function renderOrderImportPreview(){
  const el = document.getElementById('orderImportPreview');
  if(orderImportGroups.length === 0){ el.innerHTML = `<div class="empty">No orders found. Make sure it's the standard Shopify order export.</div>`; return; }
  const matchable = orderImportGroups.filter(g => g.items.every(it => matchProductForItem(it)));
  el.innerHTML = `
    <div class="role-note" style="margin:14px 0;">${orderImportGroups.length} orders found, ${matchable.length} with every item matched to your catalog (by SKU or name). Unmatched items still get imported with their name and price — just without a catalog link (won't affect profit KPIs until linked).</div>
    <table><thead><tr><th>Order</th><th>Customer</th><th class="num">Total</th><th>Items match?</th></tr></thead>
    <tbody>${orderImportGroups.slice(0,8).map(g=>`<tr><td>${g.orderName}</td><td>${g.custName||g.email||'—'}</td><td class="num">${inr(g.total)}</td><td>${g.items.every(it=>matchProductForItem(it)) ? '<span style="color:var(--sage)">yes</span>' : '<span class="badge-low">some unmatched</span>'}</td></tr>`).join('')}</tbody></table>
    ${orderImportGroups.length>8 ? `<div class="role-note" style="margin-top:8px;">…and ${orderImportGroups.length-8} more</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runOrderImportBtn" onclick="runOrderImport()">Import ${orderImportGroups.length} orders</button>
    </div>`;
}
async function runOrderImport(){
  const btn = document.getElementById('runOrderImportBtn');
  btn.disabled = true;
  let done = 0, unmatchedItems = 0;
  for(const g of orderImportGroups){
    btn.textContent = `Importing ${done+1} of ${orderImportGroups.length}…`;
    let customerId = null;
    if(g.custName || g.email){
      let existing = g.email ? state.customers.find(c=>c.email===g.email) : null;
      if(!existing && g.phone) existing = state.customers.find(c=>c.phone===g.phone);
      if(existing){
        customerId = existing.customer_id;
        const patch = {};
        if(!existing.phone && g.phone) patch.phone = g.phone;
        if(!existing.address && g.address) patch.address = g.address;
        if(Object.keys(patch).length) await sb.from('customers').update(patch).eq('customer_id', customerId);
      }else{
        const {data:newCust} = await sb.from('customers').insert({name:g.custName||g.email, phone:g.phone, email:g.email, address:g.address}).select().single();
        if(newCust){ customerId = newCust.customer_id; state.customers.push(newCust); }
      }
    }
    const finalAmount = g.total;
    // Shopify's own "Taxes" export is frequently 0 even when the price genuinely includes GST
    // (common when GST wasn't configured as a separate line in Shopify). So instead of trusting
    // that column, we impute GST the same way the rest of the app does: work backward from the
    // final amount actually paid, using each item's own GST rate where we can match the product.
    let gstWeighted = 0;
    g.items.forEach(it=>{ const p = matchProductForItem(it); gstWeighted += (p ? p.gst_rate : 3) * it.price*it.qty; });
    const avgGst = finalAmount>0 ? gstWeighted/finalAmount : 3;
    const gs = computeGst(finalAmount, avgGst, 'intra-state');
    const {data: sale, error: saleErr} = await sb.from('sales').insert({
      invoice_number: g.orderName,
      customer_id: customerId,
      channel: 'online',
      sale_date: g.createdAt,
      subtotal_before_discount: finalAmount + g.discount,
      discount_value: g.discount,
      final_amount: finalAmount,
      taxable_value: gs.taxable,
      cgst_amount: gs.cgst, sgst_amount: gs.sgst, igst_amount: gs.igst,
      state_type: 'intra-state',
      payment_method: g.financialStatus || 'Online',
    }).select().single();
    if(saleErr) continue;
    const items = g.items.map(it => {
      const p = matchProductForItem(it);
      if(!p) unmatchedItems++;
      return {
        sale_id: sale.sale_id,
        product_id: p ? p.product_id : null,
        item_name: it.name || (p ? p.name : 'Product'),
        quantity: it.qty,
        unit_price: it.price,
        landing_price_snapshot: p ? p.landing_price : it.price,
        line_total: it.price*it.qty,
        hsn_code: p ? (hsnFor(p) || null) : null, mrp: p ? (mrpFor(p) || null) : null,
      };
    });
    if(items.length>0) await sb.from('sale_items').insert(items);
    done++;
  }
  closeModal();
  await loadAll();
  alert(`Imported ${done} orders.${unmatchedItems>0 ? ` ${unmatchedItems} line items couldn't be matched to a catalog product but were still recorded with their name.` : ''} Stock was not changed.`);
}

// ---------- OFFLINE BILLS IMPORT (Excel / CSV) ----------
// Reads a sheet like: Invoice no | Date | Customer Name | Product | Qty | Sold at price | Mrp | Total
// Invoice no / date / customer only need to be on the first row of each bill; "Total" rows set the bill total.
let offlineImport = {invoices: []};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function titleCase(s){ return String(s||'').trim().replace(/\s+/g,' ').toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase()); }
function toNum(v){
  if(v===''||v===null||v===undefined) return null;
  const n = parseFloat(String(v).replace(/[₹,\s]/g,''));
  return isNaN(n) ? null : n;
}
function parseSheetDate(v){
  // always returns a local date at 12:00 so timezone shifts can never move it to the wrong day
  if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate(), 12);
  if(typeof v === 'number' && v > 20000 && v < 80000){
    const d = new Date(Date.UTC(1899,11,30) + Math.round(v)*86400000); // Excel serial date
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12);
  }
  const s = String(v==null?'':v).trim();
  if(!s) return null;
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); // dd/mm/yyyy (India)
  if(m){ let y = +m[3]; if(y<100) y += 2000; return new Date(y, +m[2]-1, +m[1], 12); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3], 12);
  const d2 = new Date(s);
  return isNaN(d2) ? null : new Date(d2.getFullYear(), d2.getMonth(), d2.getDate(), 12);
}
function findOfflineColumns(rows){
  for(let i=0; i<Math.min(rows.length, 15); i++){
    const col = {};
    (rows[i]||[]).forEach((cell, idx)=>{
      const h = String(cell==null?'':cell).toLowerCase().replace(/[^a-z]/g,'');
      if(!h) return;
      if(h.includes('mrp')){ if(col.mrp===undefined) col.mrp = idx; }
      else if(h.includes('price') || h.includes('rate') || h.includes('soldat')){ if(col.price===undefined) col.price = idx; }
      else if(h==='qty' || h.includes('quantity')){ if(col.qty===undefined) col.qty = idx; }
      else if(h.includes('invoice') || h.includes('billno') || h==='bill'){ if(col.invoice===undefined) col.invoice = idx; }
      else if(h.includes('date')){ if(col.date===undefined) col.date = idx; }
      else if(h.includes('customer')){ if(col.customer===undefined) col.customer = idx; }
      else if(h.includes('product') || h.includes('item') || h.includes('sku')){ if(col.product===undefined) col.product = idx; }
      else if(h.includes('total') || h.includes('amount')){ if(col.total===undefined) col.total = idx; }
    });
    if(col.invoice!==undefined && col.product!==undefined) return {col, headerIdx:i};
  }
  throw new Error('Could not find the header row. The sheet needs columns named like "Invoice no", "Date", "Customer Name", "Product", "Qty", "Sold at price", "Total".');
}
function matchOfflineProduct(text){
  return matchProductForItem({sku:text, name:text});
}
function buildOfflineInvoices(rows){
  const {col, headerIdx} = findOfflineColumns(rows);
  const get = (row, k) => col[k]!==undefined ? row[col[k]] : '';
  const invoices = [];
  let cur = null;
  for(const row of rows.slice(headerIdx+1)){
    if(!row) continue;
    const invRaw = String(get(row,'invoice')==null?'':get(row,'invoice')).trim();
    const productRaw = String(get(row,'product')==null?'':get(row,'product')).trim();
    const hasTotalWord = row.some(cell => /^(grand\s*)?total$/i.test(String(cell==null?'':cell).trim()));
    if(invRaw){
      cur = {invoice: invRaw.toUpperCase().replace(/\s+/g,''), date: parseSheetDate(get(row,'date')),
        customer: titleCase(get(row,'customer')), lines: [], sheetTotal: null, notes: [], status:'ready', problem:''};
      invoices.push(cur);
    }
    if(!cur) continue;
    if(hasTotalWord && !productRaw){
      const t = toNum(get(row,'total'));
      if(t!==null) cur.sheetTotal = t;
      continue;
    }
    if(productRaw){
      cur.lines.push({text: productRaw.replace(/\s+/g,' '), qtyRaw: toNum(get(row,'qty')),
        price: toNum(get(row,'price')), mrp: toNum(get(row,'mrp')), lineTotalRaw: toNum(get(row,'total'))});
    }
  }
  const seen = new Set();
  const existingNums = new Set(state.sales.map(s => String(s.invoice_number||'').toUpperCase()));
  for(const inv of invoices) resolveOfflineInvoice(inv, seen, existingNums);
  return invoices;
}
function resolveOfflineInvoice(inv, seen, existingNums){
  const fail = (msg) => { inv.status = 'problem'; inv.problem = msg; };
  if(seen.has(inv.invoice)){ inv.status='skip'; inv.problem='Same bill number appears twice in the file'; return; }
  seen.add(inv.invoice);
  if(existingNums.has(inv.invoice)){ inv.status='skip'; inv.problem='Already in your system — skipped'; return; }
  if(!inv.date){ fail('Date is missing or not readable'); return; }
  if(inv.lines.length===0){ fail('No items found under this bill'); return; }

  let assumedQty = 0;
  inv.lines.forEach(l => {
    l.matched = matchOfflineProduct(l.text);
    if(l.qtyRaw===null || l.qtyRaw<=0){ l.qty = 1; assumedQty++; } else l.qty = l.qtyRaw;
    if(l.lineTotalRaw!==null) l.total = l.lineTotalRaw;
    else if(l.price!==null) l.total = l.qty * l.price;
    else l.total = null;
  });
  if(assumedQty) inv.notes.push(`Quantity not given for ${assumedQty} item${assumedQty>1?'s':''} — assumed 1.`);

  const unknown = inv.lines.filter(l => l.total===null);
  const knownSum = inv.lines.filter(l => l.total!==null).reduce((a,l)=>a+l.total, 0);
  if(unknown.length){
    if(inv.sheetTotal===null){ fail('Item prices are missing and there is no Total row'); return; }
    const remaining = inv.sheetTotal - knownSum;
    if(remaining <= 0){ fail('Total is not higher than the prices already given'); return; }
    // split the remaining amount across items without a price, in proportion to MRP (sheet MRP, else catalogue price)
    let weights = unknown.map(l => l.mrp || (l.matched ? Number(l.matched.selling_price) : null) || null);
    const known = weights.filter(w => w);
    const fallback = known.length ? known.reduce((a,b)=>a+b,0)/known.length : 1;
    weights = weights.map(w => w || fallback);
    const wSum = weights.reduce((a,b)=>a+b,0);
    let allocated = 0;
    unknown.forEach((l, i) => {
      const share = (i === unknown.length-1) ? Math.round((remaining - allocated)*100)/100 : Math.round(remaining*weights[i]/wSum*100)/100;
      l.total = share; allocated += share; l.allocated = true;
    });
    inv.notes.push(`Item prices were not in the sheet — ₹${Math.round(remaining).toLocaleString('en-IN')} was split across ${unknown.length} item${unknown.length>1?'s':''} in proportion to their MRP. Check this one.`);
  }
  inv.lines.forEach(l => { l.unit = Math.round(l.total / l.qty * 100)/100; });

  const subtotal = inv.lines.reduce((a,l)=>a+l.total, 0);
  let finalAmount = inv.sheetTotal!==null ? inv.sheetTotal : subtotal;
  let discount = 0;
  if(inv.sheetTotal!==null && Math.abs(inv.sheetTotal - subtotal) > 0.5){
    if(inv.sheetTotal < subtotal){
      discount = Math.round((subtotal - inv.sheetTotal)*100)/100;
      inv.notes.push(`Items add up to ₹${Math.round(subtotal).toLocaleString('en-IN')} but the bill total is ₹${Math.round(inv.sheetTotal).toLocaleString('en-IN')} — the difference is recorded as a discount.`);
    }else{
      finalAmount = inv.sheetTotal;
      inv.notes.push(`Items add up to less than the bill total — the bill total ₹${Math.round(inv.sheetTotal).toLocaleString('en-IN')} was kept.`);
    }
  }
  inv.subtotal = Math.max(subtotal, finalAmount);
  inv.discount = inv.subtotal - finalAmount;
  inv.finalAmount = finalAmount;
  if(discount && Math.abs(inv.discount - discount) > 0.01) inv.discount = discount;
  const unlinked = inv.lines.filter(l => !l.matched).length;
  if(unlinked) inv.notes.push(`${unlinked} item${unlinked>1?'s are':' is'} not in your product list — saved by name only (won't count towards profit figures).`);
}
function openOfflineImportModal(){

  openModal(`

function handleOfflineFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const out = document.getElementById('offlineImportPreview');
  out.innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  const showError = (err) => { out.innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${esc(err.message||err)}</div>`; };
  const finish = (rows) => { try{ offlineImport.invoices = buildOfflineInvoices(rows); renderOfflineImportPreview(); }catch(err){ showError(err); } };
  if(/\.csv$/i.test(file.name)){
    Papa.parse(file, {skipEmptyLines:false, complete: (res)=> finish(res.data), error: showError});
  }else{
    const reader = new FileReader();
    reader.onload = (ev) => {
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        finish(XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''}));
      }catch(err){ showError(err); }
    };
    reader.onerror = () => showError('The file could not be opened');
    reader.readAsArrayBuffer(file);
  }
}

        ${i.notes.length && i.status==='ready' ? `<tr><td></td><td colspan="5" style="font-size:12px;color:var(--gold-deep);">${i.notes.map(esc).join('<br>')}</td></tr>` : ''}

    </label>

      <button class="secondary" onclick="closeModal()">Cancel</button>

}
async function runOfflineImport(){
  const btn = document.getElementById('runOfflineImportBtn');
  btn.disabled = true;
  const reduceStock = document.getElementById('offlineReduceStock').checked;
  const todo = offlineImport.invoices.filter(i=>i.status==='ready');
  let done = 0; const failed = [];
  for(const inv of todo){
    btn.textContent = `Importing ${done+failed.length+1} of ${todo.length}…`;
    let customerId = null;
    if(inv.customer){
      const existing = state.customers.find(c => String(c.name||'').trim().toLowerCase() === inv.customer.toLowerCase());
      if(existing) customerId = existing.customer_id;
      else{
        const {data:newCust} = await sb.from('customers').insert({name: inv.customer}).select().single();
        if(newCust){ customerId = newCust.customer_id; state.customers.push(newCust); }
      }
    }
    let gstWeighted = 0;
    inv.lines.forEach(l => { gstWeighted += (l.matched ? Number(l.matched.gst_rate) : 3) * l.total; });
    const lineSum = inv.lines.reduce((a,l)=>a+l.total,0);
    const avgGst = lineSum>0 ? gstWeighted/lineSum : 3;
    const gs = computeGst(inv.finalAmount, avgGst, 'intra-state');
    const {data: sale, error: saleErr} = await sb.from('sales').insert({
      invoice_number: inv.invoice, customer_id: customerId, channel: 'store', sale_date: inv.date.toISOString(),
      subtotal_before_discount: inv.subtotal, discount_value: inv.discount, final_amount: inv.finalAmount,
      taxable_value: gs.taxable, cgst_amount: gs.cgst, sgst_amount: gs.sgst, igst_amount: gs.igst,
      state_type: 'intra-state', payment_method: 'Not recorded',
    }).select().single();
    if(saleErr){ failed.push(`${inv.invoice}: ${saleErr.message}`); continue; }
    const items = inv.lines.map(l => ({
      sale_id: sale.sale_id, product_id: l.matched ? l.matched.product_id : null,
      item_name: l.matched ? l.matched.name : l.text, quantity: l.qty, unit_price: l.unit,
      landing_price_snapshot: l.matched ? l.matched.landing_price : l.unit, line_total: l.total,
      hsn_code: l.matched ? (hsnFor(l.matched) || null) : null,
      mrp: l.mrp || (l.matched ? mrpFor(l.matched) : null) || null,
    }));
    const {error: itemsErr} = await sb.from('sale_items').insert(items);
    if(itemsErr){
      await sb.from('sales').delete().eq('sale_id', sale.sale_id); // never leave a bill without its items
      failed.push(`${inv.invoice}: ${itemsErr.message}`); continue;
    }
    if(reduceStock){
      for(const l of inv.lines){
        if(!l.matched) continue;
        await sb.from('inventory_transactions').insert({product_id: l.matched.product_id, type:'sale_out', quantity: -l.qty, reference_id: sale.sale_id, channel:'store'});
        l.matched.stock_qty = l.matched.stock_qty - l.qty;
        await sb.from('products').update({stock_qty: l.matched.stock_qty}).eq('product_id', l.matched.product_id);
      }
    }
    done++;
  }
  closeModal();
  await loadAll();
  state.route = 'orders';
  render();
  alert(`Imported ${done} of ${todo.length} bills.${failed.length ? '\n\nCould not import:\n' + failed.join('\n') : ''}${reduceStock ? '' : '\n\nStock was not changed.'}`);
}

function addHistItem(){
  const productId = document.getElementById('h_productSelect').value;
  const qty = parseInt(document.getElementById('h_qty').value)||1;

function removeHistItem(i){ histCart.splice(i,1); renderHistCartLines(); }
function renderHistCartLines(){
  const el = document.getElementById('histCartLines');
  if(histCart.length===0){ el.innerHTML = `<div class="empty">No items added yet.</div>`; document.getElementById('histTotalPreview').textContent=''; return; }

    return `<div class="cart-line"><span>${p.name} × ${l.qty}</span><span class="num">${inr(l.price*l.qty)} <button class="small secondary" style="margin-left:6px;" onclick="removeHistItem(${i})">×</button></span></div>`;
  }).join('');

async function saveHistoricalSale(){
  if(histCart.length===0){ alert('Add at least one item.'); return; }
  const btn = document.getElementById('saveHistBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const custName = document.getElementById('h_custname').value.trim();
  const custPhone = document.getElementById('h_custphone').value.trim();
  let customerId = null;
  if(custName){
    let existing = custPhone ? state.customers.find(c=>c.phone===custPhone) : state.customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
    if(existing) customerId = existing.customer_id;
    else{
      const {data:newCust} = await sb.from('customers').insert({name:custName, phone:custPhone}).select().single();
      if(newCust) customerId = newCust.customer_id;
    }
  }
  const subtotal = histCart.reduce((a,l)=>a+l.price*l.qty,0);
  const discount = parseFloat(document.getElementById('h_discount').value)||0;
  const finalAmount = Math.max(0, subtotal - discount);
  let gstWeighted = 0;
  histCart.forEach(l=>{ const p = state.products.find(p=>p.product_id===l.productId); gstWeighted += (p.gst_rate * l.price*l.qty); });
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 0;
  const stateType = document.getElementById('h_stateType').value;
  const gh = computeGst(finalAmount, avgGst, stateType);
  const dateVal = document.getElementById('h_date').value;
  const customBillNum = document.getElementById('h_billnum').value.trim();

  const {data: sale, error: saleErr} = await sb.from('sales').insert({
    invoice_number: customBillNum || ('OFF-' + Date.now().toString().slice(-8)),
    customer_id: customerId,
    channel: 'store',
    sale_date: dateVal,
    subtotal_before_discount: subtotal,
    discount_value: discount,
    final_amount: finalAmount,
    taxable_value: gh.taxable,
    cgst_amount: gh.cgst,
    sgst_amount: gh.sgst,
    igst_amount: gh.igst,
    state_type: stateType,
    payment_method: document.getElementById('h_payment').value,
  }).select().single();
  if(saleErr){
    if(saleErr.message.includes('duplicate') || saleErr.code==='23505') alert('That bill number is already used on another invoice — choose a different one.');
    else alert('Could not save: '+saleErr.message);
    btn.disabled=false; btn.textContent='Save past sale'; return;
  }

  const items = histCart.map(l=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return {sale_id: sale.sale_id, product_id: p.product_id, item_name: p.name, quantity: l.qty, unit_price: l.price, landing_price_snapshot: p.landing_price, line_total: l.price*l.qty, hsn_code: hsnFor(p) || null, mrp: mrpFor(p) || null};
  });
  await sb.from('sale_items').insert(items);
  // deliberately no inventory_transactions or stock_qty change — this sale already happened before tracking started

  closeModal();
  await loadAll();
  alert('Past sale recorded: ' + sale.invoice_number);
}

  `;

function downloadReportCsv(){
  const sales = [...reportPeriodSales()].sort((a,b)=>new Date(a.sale_date)-new Date(b.sale_date));
  const periodLabel = reportMode==='monthly' ? reportMonth : String(reportYear);
  const header = ['Bill Number','Date','Customer','Channel','Payment Method','Subtotal','Discount','Discount on bill','Taxable Value','CGST','SGST','IGST','Total'];
  const rows = sales.map(s=>{
    const cust = state.customers.find(c=>c.customer_id===s.customer_id);
    return [
      s.invoice_number,
      new Date(s.sale_date).toLocaleDateString('en-IN'),
      cust ? cust.name : 'Walk-in',
      s.channel,
      s.payment_method || '',
      s.subtotal_before_discount,
      s.discount_value,
      Math.round((Math.max(Number(s.subtotal_before_discount), Number(s.final_amount)) - Number(s.taxable_value))*100)/100,
      s.taxable_value,
      s.cgst_amount,
      s.sgst_amount,
      s.igst_amount,
      s.final_amount,
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `swasole-sales-register-${periodLabel}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

    </div>
    <div id="dashBody"></div>`;
  document.getElementById('fRange').value = dashFilters.range;
  document.getElementById('fChannel').value = dashFilters.channel;
  document.getElementById('fCategory').value = dashFilters.categoryId;
  renderDashBody();
}
function updateDashFilters(){
  dashFilters.range = document.getElementById('fRange').value;
  dashFilters.channel = document.getElementById('fChannel').value;
  dashFilters.categoryId = document.getElementById('fCategory').value;
  renderDashBody();
}
function itemsForSale(saleId){ return state.saleItems.filter(i=>i.sale_id===saleId); }
function filteredSales(){
  const now = new Date();
  return state.sales.filter(s=>{
    if(dashFilters.range!=='all'){
      const days = parseInt(dashFilters.range);
      const cutoff = new Date(now.getTime() - days*24*60*60*1000);
      if(new Date(s.sale_date) < cutoff) return false;
    }
    if(dashFilters.channel!=='all' && s.channel!==dashFilters.channel) return false;
    if(dashFilters.categoryId!=='all'){
      const has = itemsForSale(s.sale_id).some(it=>{
        const p = state.products.find(p=>p.product_id===it.product_id);
        return p && p.category_id === dashFilters.categoryId;
      });
      if(!has) return false;
    }
    return true;
  });
}
function renderDashBody(){
  const el = document.getElementById('dashBody');
  const sales = filteredSales();
  if(sales.length===0 && state.sales.length===0){
    el.innerHTML = `<div class="empty">No sales recorded yet. Numbers will appear here once you start billing.</div>`;
    return;
  }
  const revenue = sales.reduce((a,s)=>a+Number(s.final_amount),0);
  const orders = sales.length;
  const allItems = sales.flatMap(s=>itemsForSale(s.sale_id));
  const units = allItems.reduce((a,i)=>a+i.quantity,0);
  const aov = orders>0 ? revenue/orders : 0;
  const profit = allItems.reduce((a,i)=>a+(Number(i.unit_price)-Number(i.landing_price_snapshot))*i.quantity,0);
  const margin = revenue>0 ? (profit/revenue*100) : 0;
  const gstCollected = sales.reduce((a,s)=>a+Number(s.cgst_amount)+Number(s.sgst_amount)+Number(s.igst_amount),0);
  const discountTotal = sales.reduce((a,s)=>a+Number(s.discount_value),0);
  const storeRev = sales.filter(s=>s.channel==='store').reduce((a,s)=>a+Number(s.final_amount),0);
  const onlineRev = sales.filter(s=>s.channel==='online').reduce((a,s)=>a+Number(s.final_amount),0);
  const inventoryValue = state.products.reduce((a,p)=>a+Number(p.landing_price)*p.stock_qty,0);
  const lowStock = state.products.filter(p=>p.stock_qty<=p.low_stock_threshold);
  const outOfStock = state.products.filter(p=>p.stock_qty<=0);
  const custIds = [...new Set(sales.map(s=>s.customer_id).filter(Boolean))];
  const repeatCustomers = custIds.filter(cid => sales.filter(s=>s.customer_id===cid).length>=2);
  const repeatRate = custIds.length>0 ? (repeatCustomers.length/custIds.length*100) : 0;

  const prodRev = {};
  allItems.forEach(it=>{ const p = state.products.find(p=>p.product_id===it.product_id); const name = p ? p.name : (it.item_name || 'Unlinked product'); prodRev[name] = (prodRev[name]||0) + Number(it.line_total); });
  const topProducts = Object.entries(prodRev).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxProdRev = Math.max(1, ...topProducts.map(p=>p[1]));

  const catRev = {};
  allItems.forEach(it=>{ const p = state.products.find(p=>p.product_id===it.product_id); const cname = p ? catName(p.category_id) : 'Other'; catRev[cname] = (catRev[cname]||0) + Number(it.line_total); });
  const catEntries = Object.entries(catRev);
  const maxCatRev = Math.max(1, ...catEntries.map(c=>c[1]));

  // revenue trend by day (bucketed to at most ~14 bars for readability)
  const dayRev = {};
  sales.forEach(s=>{
    const d = new Date(s.sale_date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
    dayRev[d] = (dayRev[d]||0) + Number(s.final_amount);
  });
  let trendEntries = Object.entries(dayRev).sort((a,b)=> new Date(a[0]+' 2025') - new Date(b[0]+' 2025'));
  if(trendEntries.length > 14){
    // collapse into ~14 buckets by grouping consecutive days
    const bucketSize = Math.ceil(trendEntries.length/14);
    const bucketed = [];
    for(let i=0;i<trendEntries.length;i+=bucketSize){
      const chunk = trendEntries.slice(i, i+bucketSize);
      const label = chunk.length>1 ? `${chunk[0][0]}–${chunk[chunk.length-1][0]}` : chunk[0][0];
      bucketed.push([label, chunk.reduce((a,c)=>a+c[1],0)]);
    }
    trendEntries = bucketed;
  }
  const maxTrend = Math.max(1, ...trendEntries.map(t=>t[1]));

  // stock by category — current snapshot, not filtered by date/channel
  const stockByCat = {};
  const valueByCat = {};
  state.products.forEach(p=>{
    const cname = catName(p.category_id);
    stockByCat[cname] = (stockByCat[cname]||0) + p.stock_qty;
    valueByCat[cname] = (valueByCat[cname]||0) + (p.landing_price * p.stock_qty);
  });
  const stockEntries = Object.entries(stockByCat).sort((a,b)=>b[1]-a[1]);
  const maxStock = Math.max(1, ...stockEntries.map(s=>s[1]));
  const valueEntries = Object.entries(valueByCat).sort((a,b)=>b[1]-a[1]);
  const maxValue = Math.max(1, ...valueEntries.map(v=>v[1]));

  el.innerHTML = `
    <div class="section-title">Sales &amp; revenue</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Revenue</div><div class="value">${inr(revenue)}</div></div>
      <div class="kpi"><div class="label">Orders</div><div class="value">${orders}</div></div>
      <div class="kpi"><div class="label">Units sold</div><div class="value">${units}</div></div>
      <div class="kpi"><div class="label">Avg order value</div><div class="value">${inr(aov)}</div></div>
      <div class="kpi"><div class="label">Store vs online</div><div class="value" style="font-size:16px;">${inr(storeRev)} / ${inr(onlineRev)}</div></div>
    </div>

    <div class="section-title">Revenue trend</div>
    <div class="bar-chart" style="margin-bottom:28px;">
      ${trendEntries.length===0 ? '<div class="empty">No data for this filter.</div>' : trendEntries.map(([label,rev])=>`
        <div class="col">
          <div class="bar" style="height:${Math.max(2,(rev/maxTrend*140))}px;" title="${inr(rev)}"></div>
          <div class="barlabel">${label}<br>${inr(rev)}</div>
        </div>`).join('')}
    </div>

    <div class="section-title">Profitability</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Gross profit</div><div class="value">${inr(profit)}</div></div>
      <div class="kpi"><div class="label">Gross margin</div><div class="value">${margin.toFixed(1)}%</div></div>
      <div class="kpi"><div class="label">Discount given</div><div class="value">${inr(discountTotal)}</div></div>
    </div>
    <div class="section-title">Inventory</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Inventory value</div><div class="value">${inr(inventoryValue)}</div></div>
      <div class="kpi"><div class="label">Low stock</div><div class="value ${lowStock.length>0?'badge-low':''}">${lowStock.length}</div></div>
      <div class="kpi"><div class="label">Out of stock</div><div class="value ${outOfStock.length>0?'badge-low':''}">${outOfStock.length}</div></div>
    </div>
    <div class="grid2" style="margin-bottom:28px;">
      <div><div class="section-title">Stock on hand by category (units)</div>
        ${stockEntries.length===0 ? '<div class="empty">No products yet.</div>' : stockEntries.map(([name,qty])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(qty/maxStock*100)}%;"></div></div>
          <div class="hbar-val">${qty} units</div></div>`).join('')}
      </div>
      <div><div class="section-title">Stock value by category (₹)</div>
        ${valueEntries.length===0 ? '<div class="empty">No products yet.</div>' : valueEntries.map(([name,val])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(val/maxValue*100)}%;"></div></div>
          <div class="hbar-val">${inr(val)}</div></div>`).join('')}
      </div>
    </div>
    <div class="section-title">Tax</div>
    <div class="kpi-grid"><div class="kpi"><div class="label">GST collected</div><div class="value">${inr(gstCollected)}</div></div></div>
    <div class="section-title">Customers</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Buyers (period)</div><div class="value">${custIds.length}</div></div>
      <div class="kpi"><div class="label">Repeat rate</div><div class="value">${repeatRate.toFixed(0)}%</div></div>
    </div>
    <div class="grid2" style="margin-top:8px;">
      <div><div class="section-title">Top products by revenue</div>
        ${topProducts.length===0 ? '<div class="empty">No data for this filter.</div>' : topProducts.map(([name,rev])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(rev/maxProdRev*100)}%;"></div></div>
          <div class="hbar-val">${inr(rev)}</div></div>`).join('')}
      </div>
      <div><div class="section-title">Revenue by category</div>
        ${catEntries.length===0 ? '<div class="empty">No data for this filter.</div>' : catEntries.map(([name,rev])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(rev/maxCatRev*100)}%;"></div></div>
          <div class="hbar-val">${inr(rev)}</div></div>`).join('')}
      </div>
    </div>`;
}

// ================= AUTH ================
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter both email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Logging in…';
  const {error} = await sb.auth.signInWithPassword({email, password});
  btn.disabled = false; btn.textContent = 'Log in';
  if(error){ errEl.textContent = error.message; return; }
  await showApp();
}
async function doLogout(){
  await sb.auth.signOut();
  window.location.reload();
}
async function showApp(){
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  document.getElementById('mobileTabs').style.display = '';
  await loadAll();
}
async function initAuth(){
  const lv = document.getElementById('loginVersion'); if(lv) lv.textContent = 'Version ' + APP_VERSION;
  const {data: {session}} = await sb.auth.getSession();
  if(session){
    await showApp();
  }else{
    document.getElementById('loginScreen').classList.add('show');
    document.getElementById('loginScreen').style.display = 'flex';
  }
}
sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT'){
    document.getElementById('appShell').style.display = 'none';
    document.getElementById('mobileTabs').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
});

initAuth();
</script>
</body>
</html>
