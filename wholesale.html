<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wholesale Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --ink:#2B2622; --ink-soft:#8A7E72;
  --gold:#B8824F; --sage:#69795F; --rose:#A5483F; --line:#E6DCCF;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:26px;}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;}
.header{background:var(--surface);border-bottom:1px solid var(--line);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.wrap{max-width:1000px;margin:0 auto;padding:24px;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:13px;font-weight:600;}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
button:disabled{opacity:0.5;cursor:not-allowed;}
input,textarea{font-family:'Inter',sans-serif;padding:9px 11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;width:100%;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:20px;}
.card{background:var(--surface);border:1px solid var(--line);padding:14px;}
.imgbox{width:100%;aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:11px;margin-bottom:10px;overflow:hidden;}
.imgbox img{width:100%;height:100%;object-fit:cover;}
.mrp{color:var(--ink-soft);text-decoration:line-through;font-size:12px;}
.rate{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold);}
.qtyrow{display:flex;gap:8px;margin-top:10px;align-items:center;}
.qtyrow input{width:60px;}
.empty{color:var(--ink-soft);text-align:center;padding:40px 0;}
.cart-panel{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;z-index:10;}
.modal-backdrop{position:fixed;inset:0;background:rgba(43,38,34,0.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--surface);width:100%;max-width:480px;padding:26px;max-height:85vh;overflow-y:auto;}
.cart-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.tag{display:inline-block;padding:2px 9px;font-size:11px;border:1px solid var(--line);color:var(--ink-soft);}
</style>
</head>
<body>
<div id="root"><div class="empty">Loading…</div></div>

<script>
const SUPABASE_URL = "https://gwsomnnqnzhfeutgvjym.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0-2EQfzHSbPtAyHUIq4xOg_2VT7_kNv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const inr = (n) => '₹' + (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});

let account = null, products = [], categories = [], company = null, cart = [];

async function init(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  const root = document.getElementById('root');
  if(!token){ root.innerHTML = `<div class="empty">This link is missing an access code. Please use the exact link you were given.</div>`; return; }

  const {data: acc, error} = await sb.from('wholesale_accounts').select('*').eq('access_token', token).single();
  if(error || !acc || acc.status !== 'active'){
    root.innerHTML = `<div class="empty">This link is invalid or no longer active. Please contact us directly for a new one.</div>`;
    return;
  }
  account = acc;

  const [prods, cats, comp] = await Promise.all([
    sb.from('products').select('*, product_images(image_url, is_primary)').order('name'),
    sb.from('categories').select('*'),
    sb.from('company_settings').select('*').eq('id',1).single(),
  ]);
  products = (prods.data||[]).map(p => ({...p, image: (p.product_images && p.product_images[0]) ? p.product_images[0].image_url : null}));
  categories = cats.data || [];
  company = comp.data || {company_name:'Our store'};

  render();
}
function catName(id){ const c = categories.find(c=>c.category_id===id); return c ? c.name : ''; }
function wholesaleRate(p){ return p.selling_price * (1 - account.discount_pct/100); }

function render(){
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="header">
      <div><div class="brand">${company.company_name}</div><div style="font-size:12px;color:var(--ink-soft);">Wholesale portal — ${account.shop_name}</div></div>
      <div class="tag">Your discount: ${account.discount_pct}% off MRP</div>
    </div>
    <div class="wrap" style="padding-bottom:100px;">
      ${products.length===0 ? '<div class="empty">No products available right now.</div>' : `
      <div class="grid">${products.map(p=>`
        <div class="card">
          <div class="imgbox">${p.image?`<img src="${p.image}">`:'No photo'}</div>
          <div style="font-size:11px;color:var(--ink-soft);">${p.sku} · ${catName(p.category_id)}</div>
          <div style="font-weight:600;margin:4px 0;">${p.name}</div>
          <div class="mrp">MRP ${inr(p.selling_price)}</div>
          <div class="rate">${inr(wholesaleRate(p))}</div>
          <div style="font-size:11px;color:${p.stock_qty>0?'var(--sage)':'var(--rose)'};margin-top:4px;">${p.stock_qty>0 ? p.stock_qty+' in stock' : 'Out of stock'}</div>
          <div class="qtyrow">
            <input type="number" min="1" value="1" id="qty_${p.product_id}" ${p.stock_qty<=0?'disabled':''}>
            <button class="secondary" style="flex:1;" onclick="addToCart('${p.product_id}')" ${p.stock_qty<=0?'disabled':''}>Add</button>
          </div>
        </div>`).join('')}</div>`}
    </div>
    <div class="cart-panel">
      <div>${cart.length} item${cart.length===1?'':'s'} in order · ${inr(cartTotal())}</div>
      <button class="gold" onclick="openCartModal()" ${cart.length===0?'disabled':''}>Review &amp; submit order</button>
    </div>
  `;
}
function cartTotal(){
  return cart.reduce((s,l)=>{ const p = products.find(p=>p.product_id===l.productId); return s + wholesaleRate(p)*l.qty; },0);
}
function addToCart(productId){
  const qtyInput = document.getElementById('qty_'+productId);
  const qty = Math.max(1, parseInt(qtyInput.value)||1);
  const existing = cart.find(l=>l.productId===productId);
  if(existing) existing.qty += qty; else cart.push({productId, qty});
  render();
}
function openCartModal(){
  const root = document.getElementById('root');
  const html = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeCartModal()">
      <div class="modal">
        <h2>Your order request</h2>
        <div id="cartLines" style="margin:14px 0;"></div>
        <div class="cart-line" style="font-weight:700;"><span>Total (approx.)</span><span>${inr(cartTotal())}</span></div>
        <div style="margin-top:14px;"><label style="font-size:12px;color:var(--ink-soft);">Note (optional)</label><textarea id="orderNote" rows="2"></textarea></div>
        <p style="font-size:11.5px;color:var(--ink-soft);margin-top:10px;">This sends an order request — ${company.company_name} will confirm availability and follow up with you directly.</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;">
          <button class="secondary" onclick="closeCartModal()">Keep shopping</button>
          <button class="gold" id="submitOrderBtn" onclick="submitOrder()">Submit order request</button>
        </div>
      </div>
    </div>`;
  document.getElementById('modalHost')?.remove();
  const div = document.createElement('div'); div.id='modalHost'; div.innerHTML = html;
  document.body.appendChild(div);
  renderCartLines();
}
function renderCartLines(){
  const el = document.getElementById('cartLines');
  el.innerHTML = cart.map((l,i)=>{
    const p = products.find(p=>p.product_id===l.productId);
    return `<div class="cart-line"><span>${p.name} × ${l.qty}</span><span>${inr(wholesaleRate(p)*l.qty)} <button class="secondary" style="padding:2px 8px;margin-left:6px;" onclick="removeCartLine(${i})">×</button></span></div>`;
  }).join('');
}
function removeCartLine(i){ cart.splice(i,1); renderCartLines(); if(cart.length===0) closeCartModal(); render(); }
function closeCartModal(){ document.getElementById('modalHost')?.remove(); }
async function submitOrder(){
  const btn = document.getElementById('submitOrderBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  const {data: order, error} = await sb.from('wholesale_orders').insert({
    account_id: account.account_id, status:'pending', notes: document.getElementById('orderNote').value,
  }).select().single();
  if(error){ alert('Could not submit: '+error.message); btn.disabled=false; btn.textContent='Submit order request'; return; }
  const items = cart.map(l=>{
    const p = products.find(p=>p.product_id===l.productId);
    return {wholesale_order_id: order.wholesale_order_id, product_id: p.product_id, quantity: l.qty, wholesale_unit_price: wholesaleRate(p)};
  });
  await sb.from('wholesale_order_items').insert(items);
  cart = [];
  closeCartModal();
  document.getElementById('root').innerHTML = `<div class="wrap"><div class="empty" style="padding-top:80px;"><h2 style="margin-bottom:10px;">Order request sent</h2>${company.company_name} will review and confirm with you shortly. Thank you!</div></div>`;
}

init();
</script>
</body>
</html>
