<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swasole</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --ink:#2B2622; --ink-soft:#8A7E72;
  --gold:#B8824F; --gold-deep:#8C6239; --sage:#69795F; --rose:#A5483F; --line:#E6DCCF;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:28px;letter-spacing:0.02em;color:var(--ink);}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;}
h1{font-size:26px;} h2{font-size:20px;} h3{font-size:17px;}
.app{display:flex;min-height:100vh;}
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:28px 0 20px;display:flex;flex-direction:column;}
.sidebar .brand{padding:0 24px 24px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.navitem{padding:11px 24px;color:var(--ink-soft);cursor:pointer;font-size:13px;letter-spacing:0.02em;border-left:2px solid transparent;display:flex;align-items:center;gap:10px;}
.navitem:hover{color:var(--ink);}
.navitem.active{color:var(--ink);border-left-color:var(--gold);background:#FAF6F0;font-weight:600;}
.main{flex:1;padding:32px 40px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap;gap:10px;}
.hairline{border:none;border-top:1px solid var(--line);margin:20px 0;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 18px;font-size:13px;font-weight:600;letter-spacing:0.01em;}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
button.small{padding:5px 11px;font-size:12px;}
button:disabled{opacity:0.5;cursor:not-allowed;}
button:hover:not(:disabled){opacity:0.85;}
input,select{font-family:'Inter',sans-serif;padding:9px 11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;width:100%;}
label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.02em;}
.field{margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--ink);}
td{padding:11px 10px;border-bottom:1px solid var(--line);}
tr:hover td{background:#FCFAF6;}
.num{font-variant-numeric:tabular-nums;text-align:right;}
.tag{display:inline-block;padding:2px 9px;font-size:11px;border:1px solid var(--line);color:var(--ink-soft);}
.modal-backdrop{position:fixed;inset:0;background:rgba(43,38,34,0.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--surface);width:100%;max-width:520px;padding:28px;max-height:88vh;overflow-y:auto;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px;}
.kpi{background:var(--surface);padding:18px 20px;}
.kpi .label{font-size:11px;color:var(--ink-soft);letter-spacing:0.03em;text-transform:uppercase;margin-bottom:6px;}
.kpi .value{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;}
.section-title{font-size:12px;letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:flex-end;}
.filters .field{margin-bottom:0;min-width:140px;}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.hbar-row .name{width:150px;font-size:12.5px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hbar-track{flex:1;background:var(--line);height:14px;position:relative;}
.hbar-fill{background:var(--gold);height:100%;}
.hbar-val{width:80px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0;}
.empty{color:var(--ink-soft);font-size:13px;padding:30px 0;text-align:center;}
.pos-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
.cart-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.badge-low{color:var(--rose);}
.role-note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.imgbox{width:56px;height:56px;background:var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);overflow:hidden;}
.imgbox img{width:100%;height:100%;object-fit:cover;}
.mobile-tabs{display:none;}
.statusbar{font-size:12px;padding:8px 14px;border:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.statusbar.ok{color:var(--sage);border-color:var(--sage);}
.statusbar.err{color:var(--rose);border-color:var(--rose);}
@media(max-width:820px){
  .sidebar{display:none;}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;}
  .mobile-tabs .navitem{flex:1;flex-direction:column;font-size:10px;padding:9px 4px;text-align:center;border-left:none;border-top:2px solid transparent;gap:3px;}
  .mobile-tabs .navitem.active{border-top-color:var(--gold);border-left:none;background:transparent;}
  .main{padding:20px 16px 84px;}
  .pos-grid{grid-template-columns:1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
}
@media print{
  body *{visibility:hidden;}
  #printInvoice, #printInvoice *{visibility:visible;}
  #printInvoice{position:absolute;top:0;left:0;width:100%;padding:20px;}
  .modal-backdrop{position:static;background:none;padding:0;}
  .modal{box-shadow:none;max-width:none;padding:0;}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<div class="mobile-tabs" id="mobileTabs"></div>
<div id="modalRoot"></div>

<script>
// ====== SUPABASE CONNECTION ======
const SUPABASE_URL = "https://nvyeetbgvgdwehnymzks.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52eWVldGJndmdkd2VobnltemtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMTc0MDIsImV4cCI6MjEwNDY5MzQwMn0.LhSracWIRuZ5zH4Lh41MQCNpPmidSd5E3xMNJ7bPGpA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NAV = [
  {id:'dashboard', label:'Dashboard'},
  {id:'pos', label:'Billing'},
  {id:'orders', label:'Orders'},
  {id:'products', label:'Products'},
  {id:'customers', label:'Customers'},
  {id:'team', label:'Team'},
];

let state = { categories:[], products:[], customers:[], sales:[], saleItems:[], team:[], route:'dashboard', loaded:false, connError:null };
const inr = (n) => '₹' + (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});

// ====== DATA LOAD ======
async function loadAll(){
  try{
    const [cats, prods, custs, sales, saleItems, team] = await Promise.all([
      sb.from('categories').select('*').order('name'),
      sb.from('products').select('*, product_images(image_url, is_primary)').order('created_at', {ascending:false}),
      sb.from('customers').select('*'),
      sb.from('sales').select('*').order('sale_date', {ascending:false}),
      sb.from('sale_items').select('*'),
      sb.from('team_members').select('*'),
    ]);
    for(const r of [cats, prods, custs, sales, saleItems, team]){
      if(r.error) throw r.error;
    }
    state.categories = cats.data;
    state.products = prods.data.map(p => ({...p, image: (p.product_images && p.product_images[0]) ? p.product_images[0].image_url : null}));
    state.customers = custs.data;
    state.sales = sales.data;
    state.saleItems = saleItems.data;
    state.team = team.data;
    state.connError = null;
  }catch(e){
    console.error(e);
    state.connError = e.message || 'Could not reach the database.';
  }
  state.loaded = true;
  render();
}

function nav(route){ state.route = route; render(); }
function catName(id){ const c = state.categories.find(c=>c.category_id===id); return c ? c.name : '—'; }

function render(){
  renderSidebar(); renderMobileTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(!state.loaded){ main.innerHTML = '<div class="empty">Loading…</div>'; return; }
  if(state.connError){
    main.innerHTML = `<div class="statusbar err">Couldn't connect to Supabase: ${state.connError}</div>
      <p class="role-note">Check that the tables exist and the Row Level Security policies allow access, then reload this page.</p>`;
    return;
  }
  if(state.route === 'dashboard') renderDashboard(main);
  else if(state.route === 'pos') renderPOS(main);
  else if(state.route === 'orders') renderOrders(main);
  else if(state.route === 'products') renderProducts(main);
  else if(state.route === 'customers') renderCustomers(main);
  else if(state.route === 'team') renderTeam(main);
}
function renderSidebar(){
  document.getElementById('sidebar').innerHTML = `<div class="brand">Swasole</div>` +
    NAV.map(n => `<div class="navitem ${state.route===n.id?'active':''}" onclick="nav('${n.id}')">${n.label}</div>`).join('');
}
function renderMobileTabs(){
  document.getElementById('mobileTabs').innerHTML = NAV.map(n => `<div class="navitem ${state.route===n.id?'active':''}" onclick="nav('${n.id}')">${n.label}</div>`).join('');
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }

// ================= PRODUCTS =================
function renderProducts(main){
  main.innerHTML = `
    <div class="topbar">
      <h1>Products</h1>
      <div style="display:flex;gap:10px;">
        <button class="secondary" onclick="openCategoryModal()">Manage categories</button>
        <button class="secondary" onclick="openImportModal()">Import from Shopify</button>
        <button class="gold" onclick="openProductModal()">+ Add product</button>
      </div>
    </div>
    <table>
      <thead><tr><th></th><th>SKU</th><th>Name</th><th>Category</th><th class="num">Landing</th><th class="num">Selling</th><th class="num">Stock</th><th></th></tr></thead>
      <tbody id="productRows"></tbody>
    </table>`;
  const rows = document.getElementById('productRows');
  if(state.products.length===0){ rows.innerHTML = `<tr><td colspan="8"><div class="empty">No products yet. Add your first piece.</div></td></tr>`; return; }
  rows.innerHTML = state.products.map(p => `
    <tr>
      <td><div class="imgbox">${p.image ? `<img src="${p.image}">` : 'no photo'}</div></td>
      <td>${p.sku}</td><td>${p.name}</td>
      <td><span class="tag">${catName(p.category_id)}</span></td>
      <td class="num">${inr(p.landing_price)}</td>
      <td class="num">${inr(p.selling_price)}</td>
      <td class="num ${p.stock_qty<=p.low_stock_threshold ? 'badge-low' : ''}">${p.stock_qty}</td>
      <td><button class="small secondary" onclick="openProductModal('${p.product_id}')">Edit</button></td>
    </tr>`).join('');
}
function openCategoryModal(){
  openModal(`<h2>Categories</h2>
    <p class="role-note">Add, rename, or remove categories — changes apply everywhere instantly.</p>
    <div id="catList" style="margin:16px 0;"></div>
    <div style="display:flex;gap:8px;">
      <input id="newCatName" placeholder="New category name">
      <button class="gold small" onclick="addCategory()">Add</button>
    </div>
    <div style="margin-top:20px;text-align:right;"><button class="secondary" onclick="closeModal()">Done</button></div>`);
  renderCatList();
}
function renderCatList(){
  const el = document.getElementById('catList');
  if(!el) return;
  el.innerHTML = state.categories.map(c => `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
      <input value="${c.name}" onchange="renameCategory('${c.category_id}', this.value)">
      <button class="small secondary" onclick="deleteCategory('${c.category_id}')">Remove</button>
    </div>`).join('');
}
async function addCategory(){
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if(!name) return;
  const {error} = await sb.from('categories').insert({name});
  if(error){ alert('Could not add category: '+error.message); return; }
  input.value='';
  await loadAll(); openCategoryModal();
}
async function renameCategory(id, name){
  const {error} = await sb.from('categories').update({name}).eq('category_id', id);
  if(error){ alert(error.message); return; }
  await loadAll();
}
async function deleteCategory(id){
  if(state.products.some(p=>p.category_id===id)){ alert('This category has products in it. Reassign those products first.'); return; }
  const {error} = await sb.from('categories').delete().eq('category_id', id);
  if(error){ alert(error.message); return; }
  await loadAll(); openCategoryModal();
}
// ---------- SHOPIFY CSV IMPORT ----------
let importRows = [];
function openImportModal(){
  openModal(`
    <h2>Import from Shopify</h2>
    <p class="role-note">Upload the CSV you exported from Shopify (Products → Export). We'll pull in name, SKU, stock, price, category, and photo — you fill in real purchase cost and margin per product afterward.</p>
    <div class="field" style="margin-top:16px;"><input type="file" accept=".csv" id="csvFile" onchange="handleCsvUpload(event)"></div>
    <div id="importPreview"></div>
  `);
}
function handleCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('importPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      importRows = buildImportRows(results.data);
      renderImportPreview();
    },
    error: (err) => { document.getElementById('importPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function buildImportRows(csvRows){
  let lastTitle = '', lastType = '', lastImage = '';
  const out = [];
  for(const row of csvRows){
    const title = (row['Title'] || '').trim();
    const type = (row['Type'] || '').trim();
    const image = (row['Image Src'] || '').trim();
    if(title) lastTitle = title;
    if(type) lastType = type;
    if(image) lastImage = image;
    const sku = (row['Variant SKU'] || '').trim();
    const price = parseFloat(row['Variant Price']);
    const qty = parseInt(row['Variant Inventory Qty']);
    const optionValue = (row['Option1 Value'] || '').trim();
    if(!sku && isNaN(price)) continue; // not a product/variant row
    if(isNaN(price)) continue;
    const name = (optionValue && optionValue.toLowerCase() !== 'default title') ? `${lastTitle} - ${optionValue}` : lastTitle;
    if(!name) continue;
    out.push({
      name,
      sku: sku || ('SW-'+Math.random().toString(36).slice(2,7).toUpperCase()),
      category: lastType || 'Uncategorized',
      price,
      stock: isNaN(qty) ? 0 : qty,
      image: lastImage || null,
    });
  }
  return out;
}
function renderImportPreview(){
  const el = document.getElementById('importPreview');
  if(importRows.length === 0){
    el.innerHTML = `<div class="empty">No products found in this file. Make sure it's the standard Shopify product export.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="role-note" style="margin:14px 0;">${importRows.length} product${importRows.length===1?'':'s'} found. Purchase price will be set equal to selling price and margin to 0% for now — edit each product afterward with real cost data.</div>
    <table><thead><tr><th>Name</th><th>SKU</th><th>Category</th><th class="num">Price</th><th class="num">Stock</th></tr></thead>
    <tbody>${importRows.slice(0,8).map(r=>`<tr><td>${r.name}</td><td>${r.sku}</td><td>${r.category}</td><td class="num">${inr(r.price)}</td><td class="num">${r.stock}</td></tr>`).join('')}</tbody></table>
    ${importRows.length>8 ? `<div class="role-note" style="margin-top:8px;">…and ${importRows.length-8} more</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runImportBtn" onclick="runImport()">Import ${importRows.length} product${importRows.length===1?'':'s'}</button>
    </div>`;
}
async function runImport(){
  const btn = document.getElementById('runImportBtn');
  btn.disabled = true;
  let done = 0;
  for(const row of importRows){
    btn.textContent = `Importing ${done+1} of ${importRows.length}…`;
    let cat = state.categories.find(c=>c.name.toLowerCase() === row.category.toLowerCase());
    if(!cat){
      const {data, error} = await sb.from('categories').insert({name: row.category}).select().single();
      if(!error){ cat = data; state.categories.push(data); }
    }
    const {data: product, error: prodErr} = await sb.from('products').insert({
      sku: row.sku,
      name: row.name,
      category_id: cat ? cat.category_id : null,
      purchase_price: row.price,
      additional_charge_pct: 0,
      additional_charge_fixed: 0,
      margin_pct: 0,
      gst_rate: 3,
      stock_qty: row.stock,
      low_stock_threshold: 2,
    }).select().single();
    if(!prodErr && row.image){
      await sb.from('product_images').insert({product_id: product.product_id, image_url: row.image, is_primary: true});
    }
    done++;
  }
  closeModal();
  await loadAll();
  alert(`Imported ${done} products. Remember to edit each one with real purchase cost and margin.`);
}

function openProductModal(id){
  const existing = id ? state.products.find(p=>p.product_id===id) : null;
  const catOptions = state.categories.map(c=>`<option value="${c.category_id}" ${existing&&existing.category_id===c.category_id?'selected':''}>${c.name}</option>`).join('');
  openModal(`
    <h2>${existing ? 'Edit product' : 'Add product'}</h2>
    <div class="field"><label>Photo</label>
      <input type="file" accept="image/*" onchange="handleImageUpload(event)">
      <div id="imgPreview" style="margin-top:8px;">${existing&&existing.image?`<img src="${existing.image}" style="width:70px;height:70px;object-fit:cover;">`:''}</div>
    </div>
    <div class="grid2">
      <div class="field"><label>SKU</label><input id="f_sku" value="${existing?existing.sku:''}"></div>
      <div class="field"><label>Category</label><select id="f_cat">${catOptions}</select></div>
    </div>
    <div class="field"><label>Product name</label><input id="f_name" value="${existing?existing.name:''}"></div>
    <div class="grid3">
      <div class="field"><label>Purchase price (₹)</label><input id="f_purchase" type="number" value="${existing?existing.purchase_price:''}" oninput="previewPricing()"></div>
      <div class="field"><label>Additional charges (%)</label><input id="f_addlpct" type="number" value="${existing?existing.additional_charge_pct:0}" oninput="previewPricing()"></div>
      <div class="field"><label>Additional (₹ flat)</label><input id="f_addlfixed" type="number" value="${existing?existing.additional_charge_fixed:0}" oninput="previewPricing()"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Margin (%)</label><input id="f_margin" type="number" value="${existing?existing.margin_pct:50}" oninput="previewPricing()"></div>
      <div class="field"><label>GST rate (%)</label><input id="f_gst" type="number" value="${existing?existing.gst_rate:3}"></div>
      <div class="field"><label>Stock qty</label><input id="f_stock" type="number" value="${existing?existing.stock_qty:0}"></div>
    </div>
    <div class="field"><label>Low-stock alert threshold</label><input id="f_lowstock" type="number" value="${existing?existing.low_stock_threshold:2}"></div>
    <div class="hairline"></div>
    <div id="pricingPreview" style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;"></div>
    <div style="display:flex;justify-content:space-between;">
      ${existing?`<button class="secondary" onclick="deleteProduct('${existing.product_id}')">Delete</button>`:'<span></span>'}
      <div style="display:flex;gap:8px;">
        <button class="secondary" onclick="closeModal()">Cancel</button>
        <button class="gold" id="saveProductBtn" onclick="saveProduct('${existing?existing.product_id:''}')">Save</button>
      </div>
    </div>`);
  window._pendingImage = existing ? existing.image : null;
  previewPricing();
}
function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = `<span class="role-note">Compressing photo…</span>`;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev) => { img.src = ev.target.result; };
  img.onload = () => {
    const MAX_DIM = 900; // long edge cap, keeps files small without visible quality loss for product photos
    let {width, height} = img;
    if(width > height && width > MAX_DIM){ height = Math.round(height * MAX_DIM/width); width = MAX_DIM; }
    else if(height > MAX_DIM){ width = Math.round(width * MAX_DIM/height); height = MAX_DIM; }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    const webpDataUrl = canvas.toDataURL('image/webp', 0.82);
    window._pendingImage = webpDataUrl;
    const kb = Math.round((webpDataUrl.length * 0.75) / 1024);
    preview.innerHTML = `<img src="${webpDataUrl}" style="width:70px;height:70px;object-fit:cover;"><div class="role-note">${width}×${height}px, ~${kb}KB (WebP)</div>`;
  };
  reader.readAsDataURL(file);
}
function previewPricing(){
  const purchase = parseFloat(document.getElementById('f_purchase').value)||0;
  const addlPct = parseFloat(document.getElementById('f_addlpct').value)||0;
  const addlFixed = parseFloat(document.getElementById('f_addlfixed').value)||0;
  const marginPct = parseFloat(document.getElementById('f_margin').value)||0;
  const landing = (purchase * (1+addlPct/100)) + addlFixed;
  const selling = landing * (1+marginPct/100);
  document.getElementById('pricingPreview').innerHTML = `Landing price: <strong>${inr(landing)}</strong> &nbsp;→&nbsp; Selling price: <strong>${inr(selling)}</strong> <br><span style="font-size:11px;">(the database recalculates these automatically on save)</span>`;
}
async function saveProduct(id){
  const btn = document.getElementById('saveProductBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const data = {
    sku: document.getElementById('f_sku').value || ('SW-'+Date.now().toString().slice(-5)),
    category_id: document.getElementById('f_cat').value,
    name: document.getElementById('f_name').value || 'Untitled',
    purchase_price: parseFloat(document.getElementById('f_purchase').value)||0,
    additional_charge_pct: parseFloat(document.getElementById('f_addlpct').value)||0,
    additional_charge_fixed: parseFloat(document.getElementById('f_addlfixed').value)||0,
    margin_pct: parseFloat(document.getElementById('f_margin').value)||0,
    gst_rate: parseFloat(document.getElementById('f_gst').value)||0,
    stock_qty: parseFloat(document.getElementById('f_stock').value)||0,
    low_stock_threshold: parseFloat(document.getElementById('f_lowstock').value)||2,
  };
  let productId = id;
  let error;
  if(id){
    ({error} = await sb.from('products').update(data).eq('product_id', id));
  }else{
    const res = await sb.from('products').insert(data).select().single();
    error = res.error;
    if(!error) productId = res.data.product_id;
  }
  if(error){ alert('Could not save product: '+error.message); btn.disabled=false; btn.textContent='Save'; return; }

  if(window._pendingImage){
    await sb.from('product_images').delete().eq('product_id', productId);
    await sb.from('product_images').insert({product_id: productId, image_url: window._pendingImage, is_primary: true});
  }
  closeModal();
  await loadAll();
}
async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  const {error} = await sb.from('products').delete().eq('product_id', id);
  if(error){ alert(error.message); return; }
  closeModal();
  await loadAll();
}

let cart = [];
function renderPOS(main){
  main.innerHTML = `
    <div class="topbar"><h1>Billing</h1><span class="role-note">POS &amp; invoice generation</span></div>
    <div class="pos-grid">
      <div>
        <div class="field"><label>Search product (name or SKU)</label><input id="posSearch" oninput="renderPosProductList()" placeholder="Type to search…"></div>
        <div id="posProductList"></div>
      </div>
      <div>
        <div class="section-title">Current bill</div>
        <div id="cartLines"></div>
        <div class="section-title" style="margin-top:16px;">Customer (optional)</div>
        <div class="field"><label>Name</label><input id="posCustName" list="custNames" oninput="posCustAutofill()" placeholder="Walk-in customer"></div>
        <datalist id="custNames">${state.customers.map(c=>`<option value="${c.name}">`).join('')}</datalist>
        <div class="grid2">
          <div class="field"><label>Phone</label><input id="posCustPhone" type="tel"></div>
          <div class="field"><label>Address</label><input id="posCustAddress"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Discount (₹)</label><input id="posDiscount" type="number" value="0" oninput="renderCartTotals()"></div>
          <div class="field"><label>Sale type</label><select id="posStateType" onchange="renderCartTotals()"><option value="intra-state">Intra-state</option><option value="inter-state">Inter-state</option></select></div>
        </div>
        <div class="field"><label>Payment method</label><select id="posPayment"><option>Cash</option><option>Card</option><option>UPI</option></select></div>
        <div class="hairline"></div>
        <div id="cartTotals"></div>
        <button class="gold" id="completeSaleBtn" style="width:100%;margin-top:14px;" onclick="completeSale()">Complete sale</button>
      </div>
    </div>`;
  renderPosProductList(); renderCartTotals();
}
function posCustAutofill(){
  const name = document.getElementById('posCustName').value;
  const match = state.customers.find(c => c.name.toLowerCase() === name.toLowerCase());
  if(match){
    document.getElementById('posCustPhone').value = match.phone || '';
    document.getElementById('posCustAddress').value = match.address || '';
  }
}
function renderPosProductList(){
  const q = (document.getElementById('posSearch')?.value || '').toLowerCase();
  const list = state.products.filter(p => p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q));
  const el = document.getElementById('posProductList');
  if(!el) return;
  if(list.length===0){ el.innerHTML = `<div class="empty">No products match.</div>`; return; }
  el.innerHTML = list.map(p=>`
    <div class="cart-line" style="cursor:pointer;" onclick="addToCart('${p.product_id}')">
      <span>${p.name} <span class="tag">${p.sku}</span> ${p.stock_qty<=0?'<span class="badge-low">out of stock</span>':''}</span>
      <span class="num">${inr(p.selling_price)}</span>
    </div>`).join('');
}
function addToCart(productId){
  const p = state.products.find(p=>p.product_id===productId);
  if(p.stock_qty<=0){ alert('Out of stock'); return; }
  const line = cart.find(l=>l.productId===productId);
  if(line) line.qty += 1; else cart.push({productId, qty:1});
  renderCartLines(); renderCartTotals();
}
function renderCartLines(){
  const el = document.getElementById('cartLines');
  if(cart.length===0){ el.innerHTML = `<div class="empty">Cart is empty.</div>`; return; }
  el.innerHTML = cart.map((l,i)=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return `<div class="cart-line">
      <span>${p.name} × <input type="number" min="1" value="${l.qty}" style="width:48px;padding:2px 4px;" onchange="updateQty(${i}, this.value)"></span>
      <span class="num">${inr(p.selling_price*l.qty)} <button class="small secondary" style="margin-left:6px;" onclick="removeLine(${i})">×</button></span>
    </div>`;
  }).join('');
}
function updateQty(i, val){ cart[i].qty = Math.max(1, parseInt(val)||1); renderCartLines(); renderCartTotals(); }
function removeLine(i){ cart.splice(i,1); renderCartLines(); renderCartTotals(); }
function computeTotals(){
  const subtotal = cart.reduce((a,l)=>{ const p = state.products.find(p=>p.product_id===l.productId); return a + p.selling_price*l.qty; },0);
  const discount = parseFloat(document.getElementById('posDiscount')?.value)||0;
  const finalAmount = Math.max(0, subtotal - discount);
  let gstWeighted = 0;
  cart.forEach(l=>{ const p = state.products.find(p=>p.product_id===l.productId); gstWeighted += (p.gst_rate * p.selling_price*l.qty); });
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 0;
  const taxable = finalAmount / (1 + avgGst/100);
  const totalGst = finalAmount - taxable;
  const stateType = document.getElementById('posStateType')?.value || 'intra-state';
  const cgst = stateType==='intra-state' ? totalGst/2 : 0;
  const sgst = stateType==='intra-state' ? totalGst/2 : 0;
  const igst = stateType==='inter-state' ? totalGst : 0;
  return {subtotal, discount, finalAmount, taxable, cgst, sgst, igst, stateType};
}
function renderCartTotals(){
  const el = document.getElementById('cartTotals');
  if(!el) return;
  const t = computeTotals();
  el.innerHTML = `
    <div class="cart-line"><span>Subtotal</span><span class="num">${inr(t.subtotal)}</span></div>
    <div class="cart-line"><span>Discount</span><span class="num">-${inr(t.discount)}</span></div>
    <div class="cart-line"><span>Taxable value</span><span class="num">${inr(t.taxable)}</span></div>
    ${t.stateType==='intra-state' ? `
    <div class="cart-line"><span>CGST</span><span class="num">${inr(t.cgst)}</span></div>
    <div class="cart-line"><span>SGST</span><span class="num">${inr(t.sgst)}</span></div>` : `
    <div class="cart-line"><span>IGST</span><span class="num">${inr(t.igst)}</span></div>`}
    <div class="cart-line" style="font-weight:700;font-size:15px;"><span>Total (payable)</span><span class="num">${inr(t.finalAmount)}</span></div>`;
}
async function completeSale(){
  if(cart.length===0){ alert('Cart is empty'); return; }
  const btn = document.getElementById('completeSaleBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  // find-or-create customer from inline fields
  const custName = document.getElementById('posCustName').value.trim();
  const custPhone = document.getElementById('posCustPhone').value.trim();
  const custAddress = document.getElementById('posCustAddress').value.trim();
  let customerId = null;
  if(custName){
    let existing = custPhone ? state.customers.find(c=>c.phone===custPhone) : state.customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
    if(existing){
      customerId = existing.customer_id;
      await sb.from('customers').update({name:custName, phone:custPhone||existing.phone, address:custAddress||existing.address}).eq('customer_id', customerId);
    }else{
      const {data: newCust, error: custErr} = await sb.from('customers').insert({name:custName, phone:custPhone, address:custAddress}).select().single();
      if(!custErr) customerId = newCust.customer_id;
    }
  }

  const t = computeTotals();
  const saleRow = {
    invoice_number: 'INV-' + Date.now().toString().slice(-8),
    customer_id: customerId,
    channel: 'store',
    subtotal_before_discount: t.subtotal, discount_value: t.discount, final_amount: t.finalAmount,
    taxable_value: t.taxable, cgst_amount: t.cgst, sgst_amount: t.sgst, igst_amount: t.igst,
    state_type: t.stateType, payment_method: document.getElementById('posPayment').value,
  };
  const {data: sale, error: saleErr} = await sb.from('sales').insert(saleRow).select().single();
  if(saleErr){ alert('Could not save sale: '+saleErr.message); btn.disabled=false; btn.textContent='Complete sale'; return; }

  const items = cart.map(l=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return {sale_id: sale.sale_id, product_id: p.product_id, quantity: l.qty, unit_price: p.selling_price, landing_price_snapshot: p.landing_price, line_total: p.selling_price*l.qty};
  });
  const {error: itemsErr} = await sb.from('sale_items').insert(items);
  if(itemsErr){ alert('Sale saved but items failed: '+itemsErr.message); }

  const invTxns = cart.map(l => ({product_id: l.productId, type:'sale_out', quantity: -l.qty, reference_id: sale.sale_id, channel:'store'}));
  await sb.from('inventory_transactions').insert(invTxns);

  for(const l of cart){
    const p = state.products.find(p=>p.product_id===l.productId);
    await sb.from('products').update({stock_qty: p.stock_qty - l.qty}).eq('product_id', p.product_id);
  }

  cart = [];
  await loadAll();
  state.route = 'orders';
  render();
  openOrderDetail(sale.sale_id);
}

function printInvoice(){
  window.print();
}
function sendInvoiceWhatsApp(saleId){
  const s = state.sales.find(s=>s.sale_id===saleId);
  const items = state.saleItems.filter(i=>i.sale_id===saleId);
  const cust = state.customers.find(c=>c.customer_id===s.customer_id);
  let phone = cust && cust.phone ? cust.phone.replace(/\D/g,'') : '';
  if(phone.length===10) phone = '91'+phone; // default India country code
  const lines = [
    `*Swasole* — Invoice ${s.invoice_number}`,
    ...items.map(i=>{ const p = state.products.find(p=>p.product_id===i.product_id); return `${p?p.name:'Product'} x${i.quantity} — ${inr(i.line_total)}`; }),
    `Total paid: ${inr(s.final_amount)}`,
    `Thank you for shopping with Swasole!`
  ];
  const text = encodeURIComponent(lines.join('\n'));
  const url = phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`;
  window.open(url, '_blank');
}
async function deleteOrder(saleId){
  if(!confirm('Delete this bill? Stock will be restored for its items.')) return;
  const items = state.saleItems.filter(i=>i.sale_id===saleId);
  for(const it of items){
    const p = state.products.find(p=>p.product_id===it.product_id);
    if(p) await sb.from('products').update({stock_qty: p.stock_qty + it.quantity}).eq('product_id', p.product_id);
  }
  await sb.from('inventory_transactions').delete().eq('reference_id', saleId);
  await sb.from('sale_items').delete().eq('sale_id', saleId);
  await sb.from('sales').delete().eq('sale_id', saleId);
  closeModal();
  await loadAll();
  state.route = 'orders';
  render();
}

  renderDashBody();
}
function itemsForSale(saleId){ return state.saleItems.filter(i=>i.sale_id===saleId); }
function filteredSales(){
  const now = new Date();
  return state.sales.filter(s=>{
    if(dashFilters.range!=='all'){
      const days = parseInt(dashFilters.range);
      const cutoff = new Date(now.getTime() - days*24*60*60*1000);
      if(new Date(s.sale_date) < cutoff) return false;
    }
    if(dashFilters.channel!=='all' && s.channel!==dashFilters.channel) return false;
    if(dashFilters.categoryId!=='all'){
      const has = itemsForSale(s.sale_id).some(it=>{
        const p = state.products.find(p=>p.product_id===it.product_id);
        return p && p.category_id === dashFilters.categoryId;
      });
      if(!has) return false;
    }
    return true;
  });
}
function renderDashBody(){
  const el = document.getElementById('dashBody');
  const sales = filteredSales();
  if(sales.length===0 && state.sales.length===0){
    el.innerHTML = `<div class="empty">No sales recorded yet. Numbers will appear here once you start billing.</div>`;
    return;
  }
  const revenue = sales.reduce((a,s)=>a+Number(s.final_amount),0);
  const orders = sales.length;
  const allItems = sales.flatMap(s=>itemsForSale(s.sale_id));
  const units = allItems.reduce((a,i)=>a+i.quantity,0);
  const aov = orders>0 ? revenue/orders : 0;
  const profit = allItems.reduce((a,i)=>a+(Number(i.unit_price)-Number(i.landing_price_snapshot))*i.quantity,0);
  const margin = revenue>0 ? (profit/revenue*100) : 0;
  const gstCollected = sales.reduce((a,s)=>a+Number(s.cgst_amount)+Number(s.sgst_amount)+Number(s.igst_amount),0);
  const discountTotal = sales.reduce((a,s)=>a+Number(s.discount_value),0);
  const storeRev = sales.filter(s=>s.channel==='store').reduce((a,s)=>a+Number(s.final_amount),0);
  const onlineRev = sales.filter(s=>s.channel==='online').reduce((a,s)=>a+Number(s.final_amount),0);
  const inventoryValue = state.products.reduce((a,p)=>a+Number(p.landing_price)*p.stock_qty,0);
  const lowStock = state.products.filter(p=>p.stock_qty<=p.low_stock_threshold);
  const outOfStock = state.products.filter(p=>p.stock_qty<=0);
  const custIds = [...new Set(sales.map(s=>s.customer_id).filter(Boolean))];
  const repeatCustomers = custIds.filter(cid => sales.filter(s=>s.customer_id===cid).length>=2);
  const repeatRate = custIds.length>0 ? (repeatCustomers.length/custIds.length*100) : 0;

  const prodRev = {};
  allItems.forEach(it=>{ const p = state.products.find(p=>p.product_id===it.product_id); const name = p?p.name:'Deleted product'; prodRev[name] = (prodRev[name]||0) + Number(it.line_total); });
  const topProducts = Object.entries(prodRev).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxProdRev = Math.max(1, ...topProducts.map(p=>p[1]));

  const catRev = {};
  allItems.forEach(it=>{ const p = state.products.find(p=>p.product_id===it.product_id); const cname = p ? catName(p.category_id) : 'Other'; catRev[cname] = (catRev[cname]||0) + Number(it.line_total); });
  const catEntries = Object.entries(catRev);
  const maxCatRev = Math.max(1, ...catEntries.map(c=>c[1]));

  el.innerHTML = `
    <div class="section-title">Sales &amp; revenue</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Revenue</div><div class="value">${inr(revenue)}</div></div>
      <div class="kpi"><div class="label">Orders</div><div class="value">${orders}</div></div>
      <div class="kpi"><div class="label">Units sold</div><div class="value">${units}</div></div>
      <div class="kpi"><div class="label">Avg order value</div><div class="value">${inr(aov)}</div></div>
      <div class="kpi"><div class="label">Store vs online</div><div class="value" style="font-size:16px;">${inr(storeRev)} / ${inr(onlineRev)}</div></div>
    </div>
    <div class="section-title">Profitability</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Gross profit</div><div class="value">${inr(profit)}</div></div>
      <div class="kpi"><div class="label">Gross margin</div><div class="value">${margin.toFixed(1)}%</div></div>
      <div class="kpi"><div class="label">Discount given</div><div class="value">${inr(discountTotal)}</div></div>
    </div>
    <div class="section-title">Inventory</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Inventory value</div><div class="value">${inr(inventoryValue)}</div></div>
      <div class="kpi"><div class="label">Low stock</div><div class="value ${lowStock.length>0?'badge-low':''}">${lowStock.length}</div></div>
      <div class="kpi"><div class="label">Out of stock</div><div class="value ${outOfStock.length>0?'badge-low':''}">${outOfStock.length}</div></div>
    </div>
    <div class="section-title">Tax</div>
    <div class="kpi-grid"><div class="kpi"><div class="label">GST collected</div><div class="value">${inr(gstCollected)}</div></div></div>
    <div class="section-title">Customers</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Buyers (period)</div><div class="value">${custIds.length}</div></div>
      <div class="kpi"><div class="label">Repeat rate</div><div class="value">${repeatRate.toFixed(0)}%</div></div>
    </div>
    <div class="grid2" style="margin-top:8px;">
      <div><div class="section-title">Top products by revenue</div>
        ${topProducts.length===0 ? '<div class="empty">No data for this filter.</div>' : topProducts.map(([name,rev])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(rev/maxProdRev*100)}%;"></div></div>
          <div class="hbar-val">${inr(rev)}</div></div>`).join('')}
      </div>
      <div><div class="section-title">Revenue by category</div>
        ${catEntries.length===0 ? '<div class="empty">No data for this filter.</div>' : catEntries.map(([name,rev])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(rev/maxCatRev*100)}%;"></div></div>
          <div class="hbar-val">${inr(rev)}</div></div>`).join('')}
      </div>
    </div>`;
}

loadAll();
</script>
</body>
</html>
