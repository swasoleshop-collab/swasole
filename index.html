<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swasole</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --ink:#2B2622; --ink-soft:#8A7E72;
  --gold:#B8824F; --gold-deep:#8C6239; --sage:#69795F; --rose:#A5483F; --line:#E6DCCF;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:28px;letter-spacing:0.02em;color:var(--ink);}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;margin:0;}
h1{font-size:26px;} h2{font-size:20px;} h3{font-size:17px;}
.app{display:flex;min-height:100vh;}
.login-screen{min-height:100vh;align-items:center;justify-content:center;background:var(--bg);}
.login-screen.show{display:flex;}
.sidebar{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:28px 0 20px;display:flex;flex-direction:column;}
.sidebar .brand{padding:0 24px 24px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.navitem{padding:11px 24px;color:var(--ink-soft);cursor:pointer;font-size:13px;letter-spacing:0.02em;border-left:2px solid transparent;display:flex;align-items:center;gap:10px;}
.navitem:hover{color:var(--ink);}
.navitem.active{color:var(--ink);border-left-color:var(--gold);background:#FAF6F0;font-weight:600;}
.main{flex:1;padding:32px 40px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap;gap:10px;}
.hairline{border:none;border-top:1px solid var(--line);margin:20px 0;}
button{font-family:'Inter',sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:9px 18px;font-size:13px;font-weight:600;letter-spacing:0.01em;}
button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
button.small{padding:5px 11px;font-size:12px;}
button:disabled{opacity:0.5;cursor:not-allowed;}
button:hover:not(:disabled){opacity:0.85;}
input,select{font-family:'Inter',sans-serif;padding:9px 11px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;width:100%;}
label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:0.02em;}
.field{margin-bottom:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-soft);font-weight:600;font-size:11px;letter-spacing:0.04em;text-transform:uppercase;padding:9px 10px;border-bottom:1px solid var(--ink);}
td{padding:11px 10px;border-bottom:1px solid var(--line);}
tr:hover td{background:#FCFAF6;}
.num{font-variant-numeric:tabular-nums;text-align:right;}
.tag{display:inline-block;padding:2px 9px;font-size:11px;border:1px solid var(--line);color:var(--ink-soft);}
.modal-backdrop{position:fixed;inset:0;background:rgba(43,38,34,0.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--surface);width:100%;max-width:520px;padding:28px;max-height:88vh;overflow-y:auto;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:28px;}
.kpi{background:var(--surface);padding:18px 20px;}
.kpi .label{font-size:11px;color:var(--ink-soft);letter-spacing:0.03em;text-transform:uppercase;margin-bottom:6px;}
.kpi .value{font-family:'Inter',sans-serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}
.section-title{font-size:12px;letter-spacing:0.06em;color:var(--ink-soft);text-transform:uppercase;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:flex-end;}
.filters .field{margin-bottom:0;min-width:140px;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:190px;padding:10px 4px 0;overflow-x:auto;}
.bar-chart .col{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.bar-chart .bar{width:100%;max-width:34px;background:var(--gold);min-height:2px;}
.bar-chart .barlabel{font-size:10px;color:var(--ink-soft);text-align:center;line-height:1.3;margin-top:6px;white-space:nowrap;}
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.hbar-row .name{width:150px;font-size:12.5px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hbar-track{flex:1;background:var(--line);height:14px;position:relative;}
.hbar-fill{background:var(--gold);height:100%;}
.hbar-val{width:80px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;flex-shrink:0;}
.empty{color:var(--ink-soft);font-size:13px;padding:30px 0;text-align:center;}
.pos-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}
.cart-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
.badge-low{color:var(--rose);}
.role-note{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.imgbox{width:56px;height:56px;background:var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);overflow:hidden;}
.imgbox img{width:100%;height:100%;object-fit:cover;}
.mobile-tabs{display:none;}
.statusbar{font-size:12px;padding:8px 14px;border:1px solid var(--line);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;}
.statusbar.ok{color:var(--sage);border-color:var(--sage);}
.statusbar.err{color:var(--rose);border-color:var(--rose);}
@media(max-width:820px){
  .sidebar{display:none;}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;}
  .mobile-tabs .navitem{flex:1;flex-direction:column;font-size:10px;padding:9px 4px;text-align:center;border-left:none;border-top:2px solid transparent;gap:3px;}
  .mobile-tabs .navitem.active{border-top-color:var(--gold);border-left:none;background:transparent;}
  .main{padding:20px 16px 84px;}
  .pos-grid{grid-template-columns:1fr;}
  .grid2,.grid3{grid-template-columns:1fr;}
}
@media print{
  body *{visibility:hidden;}
  #printInvoice, #printInvoice *{visibility:visible;}
  #printInvoice{position:absolute;top:0;left:0;width:100%;padding:20px;}
  .modal-backdrop{position:static;background:none;padding:0;}
  .modal{box-shadow:none;max-width:none;padding:0;}
}
</style>
</head>
<body>
<div id="loginScreen" class="login-screen" style="display:none;">
  <div style="width:100%;max-width:340px;padding:32px;">
    <div class="brand" style="text-align:center;margin-bottom:24px;">Swasole</div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
    <div id="loginError" style="color:var(--rose);font-size:12.5px;margin-bottom:10px;"></div>
    <button class="gold" id="loginBtn" style="width:100%;" onclick="doLogin()">Log in</button>
  </div>
</div>
<div class="app" id="appShell" style="display:none;">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>
<div class="mobile-tabs" id="mobileTabs"></div>
<div id="modalRoot"></div>

<script>
// ====== SUPABASE CONNECTION ======
const SUPABASE_URL = "https://gwsomnnqnzhfeutgvjym.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0-2EQfzHSbPtAyHUIq4xOg_2VT7_kNv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NAV = [
  {id:'dashboard', label:'Dashboard'},
  {id:'pos', label:'Billing'},
  {id:'orders', label:'Orders'},
  {id:'reports', label:'Reports'},
  {id:'products', label:'Products'},
  {id:'customers', label:'Customers'},
  {id:'wholesale', label:'Wholesale'},
  {id:'team', label:'Team'},
  {id:'company', label:'Company'},
];

let state = { categories:[], products:[], customers:[], sales:[], saleItems:[], team:[], company:null, wholesaleAccounts:[], wholesaleOrders:[], wholesaleOrderItems:[], route:'dashboard', loaded:false, connError:null };
const inr = (n) => '₹' + (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});

// ====== DATA LOAD ======
async function loadAll(){
  try{
    const [cats, prods, custs, sales, saleItems, team, company, wsAccounts, wsOrders, wsItems] = await Promise.all([
      sb.from('categories').select('*').order('name'),
      sb.from('products').select('*, product_images(image_url, is_primary)').order('created_at', {ascending:false}),
      sb.from('customers').select('*'),
      sb.from('sales').select('*').order('sale_date', {ascending:false}),
      sb.from('sale_items').select('*'),
      sb.from('team_members').select('*'),
      sb.from('company_settings').select('*').eq('id', 1).single(),
      sb.from('wholesale_accounts').select('*').order('shop_name'),
      sb.from('wholesale_orders').select('*').order('submitted_at', {ascending:false}),
      sb.from('wholesale_order_items').select('*'),
    ]);
    for(const r of [cats, prods, custs, sales, saleItems, team]){
      if(r.error) throw r.error;
    }
    state.categories = cats.data;
    state.products = prods.data.map(p => ({...p, image: (p.product_images && p.product_images[0]) ? p.product_images[0].image_url : null}));
    state.customers = custs.data;
    state.sales = sales.data;
    state.saleItems = saleItems.data;
    state.team = team.data;
    state.company = company.data || {company_name:'Swasole', address:'', phone:'', email:'', gstin:''};
    state.wholesaleAccounts = wsAccounts.data || [];
    state.wholesaleOrders = wsOrders.data || [];
    state.wholesaleOrderItems = wsItems.data || [];
    state.connError = null;
  }catch(e){
    console.error(e);
    state.connError = e.message || 'Could not reach the database.';
  }
  state.loaded = true;
  render();
}

function nav(route){ state.route = route; render(); }
function catName(id){ const c = state.categories.find(c=>c.category_id===id); return c ? c.name : '—'; }

function render(){
  renderSidebar(); renderMobileTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(!state.loaded){ main.innerHTML = '<div class="empty">Loading…</div>'; return; }
  if(state.connError){
    main.innerHTML = `<div class="statusbar err">Couldn't connect to Supabase: ${state.connError}</div>
      <p class="role-note">Check that the tables exist and the Row Level Security policies allow access, then reload this page.</p>`;
    return;
  }
  if(state.route === 'dashboard') renderDashboard(main);
  else if(state.route === 'pos') renderPOS(main);
  else if(state.route === 'orders') renderOrders(main);
  else if(state.route === 'bulkEdit') renderBulkEdit(main);
  else if(state.route === 'products') renderProducts(main);
  else if(state.route === 'customers') renderCustomers(main);
  else if(state.route === 'team') renderTeam(main);
  else if(state.route === 'company') renderCompany(main);
  else if(state.route === 'reports') renderReports(main);
  else if(state.route === 'wholesale') renderWholesale(main);
}
function renderSidebar(){
  document.getElementById('sidebar').innerHTML = `<div class="brand">Swasole</div>` +
    NAV.map(n => `<div class="navitem ${state.route===n.id?'active':''}" onclick="nav('${n.id}')">${n.label}</div>`).join('') +
    `<div class="navitem" style="margin-top:auto;color:var(--rose);" onclick="doLogout()">Log out</div>`;
}
function renderMobileTabs(){
  document.getElementById('mobileTabs').innerHTML = NAV.map(n => `<div class="navitem ${state.route===n.id?'active':''}" onclick="nav('${n.id}')">${n.label}</div>`).join('');
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function openModal(html){ document.getElementById('modalRoot').innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }

// ================= PRODUCTS =================
let selectedProductIds = new Set();
let productFilter = 'all'; // all | online | offline
function renderProducts(main){
  main.innerHTML = `
    <div class="topbar">
      <h1>Products</h1>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="secondary" onclick="openCategoryModal()">Manage categories</button>
        <button class="secondary" onclick="openImportModal()">Import from Shopify</button>
        <button class="secondary" onclick="nav('bulkEdit')">Bulk edit pricing</button>
        <button class="gold" onclick="openProductModal()">+ Add product</button>
      </div>
    </div>
    <div class="filters">
      <div class="field"><label>Show</label>
        <select id="prodFilterSelect" onchange="productFilter=this.value; selectedProductIds.clear(); renderProducts(document.getElementById('main'))">
          <option value="all" ${productFilter==='all'?'selected':''}>All products</option>
          <option value="online" ${productFilter==='online'?'selected':''}>Online (on Shopify)</option>
          <option value="offline" ${productFilter==='offline'?'selected':''}>Offline (not on Shopify)</option>
        </select>
      </div>
    </div>
    <div id="bulkActionBar"></div>
    <table>
      <thead><tr><th></th><th></th><th>SKU</th><th>Name</th><th>Category</th><th class="num">Selling</th><th class="num">Stock</th><th>Listing</th><th>Status</th><th></th></tr></thead>
      <tbody id="productRows"></tbody>
    </table>`;
  const visible = state.products.filter(p => productFilter==='all' ? true : productFilter==='online' ? p.listed_on_shopify : !p.listed_on_shopify);
  const rows = document.getElementById('productRows');
  renderBulkActionBar();
  if(visible.length===0){ rows.innerHTML = `<tr><td colspan="10"><div class="empty">No products in this view.</div></td></tr>`; return; }
  rows.innerHTML = visible.map(p => `
    <tr>
      <td><input type="checkbox" ${selectedProductIds.has(p.product_id)?'checked':''} onchange="toggleProductSelect('${p.product_id}', this.checked)"></td>
      <td><div class="imgbox">${p.image ? `<img src="${p.image}">` : 'no photo'}</div></td>
      <td>${p.sku}</td><td>${p.name}</td>
      <td><span class="tag">${catName(p.category_id)}</span></td>
      <td class="num">${inr(p.selling_price)}</td>
      <td class="num ${p.stock_qty<=p.low_stock_threshold ? 'badge-low' : ''}">${p.stock_qty}</td>
      <td><span class="tag" style="${p.listed_on_shopify?'color:var(--sage);':'color:var(--gold-deep);'}">${p.listed_on_shopify?'Online':'Offline'}</span></td>
      <td><span class="tag">${(p.status||'active')}</span></td>
      <td><button class="small secondary" onclick="openProductModal('${p.product_id}')">Edit</button></td>
    </tr>`).join('');
}
function toggleProductSelect(id, checked){
  if(checked) selectedProductIds.add(id); else selectedProductIds.delete(id);
  renderBulkActionBar();
  // just update the bar, no need to re-render whole table
}
function renderBulkActionBar(){
  const el = document.getElementById('bulkActionBar');
  if(!el) return;
  if(selectedProductIds.size===0){ el.innerHTML=''; return; }
  el.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;">
      <span style="font-size:13px;">${selectedProductIds.size} selected</span>
      <button class="small secondary" onclick="exportSelectedToShopifyCsv()">Export to Shopify CSV</button>
      <button class="small secondary" onclick="bulkSetStatus('draft')">Set to Draft</button>
      <button class="small secondary" onclick="bulkSetStatus('active')">Set to Active</button>
      <button class="small secondary" onclick="bulkSetStatus('archived')">Archive</button>
      <button class="small secondary" onclick="bulkDeleteProducts()">Delete selected</button>
      <button class="small secondary" onclick="selectedProductIds.clear(); renderProducts(document.getElementById('main'))">Clear selection</button>
    </div>`;
}
async function bulkSetStatus(status){
  const ids = [...selectedProductIds];
  for(const id of ids){ await sb.from('products').update({status}).eq('product_id', id); }
  selectedProductIds.clear();
  await loadAll();
  nav('products');
}
async function bulkDeleteProducts(){
  const ids = [...selectedProductIds];
  if(!confirm(`Delete ${ids.length} product(s)? This can't be undone.`)) return;
  for(const id of ids){ await sb.from('products').delete().eq('product_id', id); }
  selectedProductIds.clear();
  await loadAll();
  nav('products');
}
function exportSelectedToShopifyCsv(){
  const ids = [...selectedProductIds];
  const rows = state.products.filter(p=>ids.includes(p.product_id));
  const header = ['Handle','Title','Body (HTML)','Vendor','Type','Tags','Published','Option1 Name','Option1 Value',
    'Variant SKU','Variant Price','Variant Inventory Qty','Variant Inventory Policy','Variant Fulfillment Service',
    'Image Src','Status'];
  const csvRows = rows.map(p=>{
    const handle = (p.name || p.sku).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || p.sku.toLowerCase();
    return [
      handle,
      p.name || '',
      p.description || '',
      state.company?.company_name || '',
      catName(p.category_id) || '',
      '',
      'TRUE',
      'Title',
      'Default Title',
      p.sku,
      p.selling_price,
      p.stock_qty,
      'deny',
      'manual',
      p.image || '',
      'active',
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = [header.join(','), ...csvRows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `shopify-import-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  if(confirm(`Downloaded ${rows.length} product(s) as a Shopify import file. Mark these as "Online" now that you're uploading them?`)){
    markSelectedOnline(ids);
  }
}
async function markSelectedOnline(ids){
  for(const id of ids){ await sb.from('products').update({listed_on_shopify:true}).eq('product_id', id); }
  selectedProductIds.clear();
  await loadAll();
  nav('products');
}

function openCategoryModal(){
  openModal(`<h2>Categories</h2>
    <p class="role-note">Add, rename, or remove categories — changes apply everywhere instantly.</p>
    <div id="catList" style="margin:16px 0;"></div>
    <div style="display:flex;gap:8px;">
      <input id="newCatName" placeholder="New category name">
      <button class="gold small" onclick="addCategory()">Add</button>
    </div>
    <div style="margin-top:20px;text-align:right;"><button class="secondary" onclick="closeModal()">Done</button></div>`);
  renderCatList();
}
function renderCatList(){
  const el = document.getElementById('catList');
  if(!el) return;
  el.innerHTML = state.categories.map(c => `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
      <input value="${c.name}" onchange="renameCategory('${c.category_id}', this.value)">
      <button class="small secondary" onclick="deleteCategory('${c.category_id}')">Remove</button>
    </div>`).join('');
}
async function addCategory(){
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if(!name) return;
  const {error} = await sb.from('categories').insert({name});
  if(error){ alert('Could not add category: '+error.message); return; }
  input.value='';
  await loadAll(); openCategoryModal();
}
async function renameCategory(id, name){
  const {error} = await sb.from('categories').update({name}).eq('category_id', id);
  if(error){ alert(error.message); return; }
  await loadAll();
}
async function deleteCategory(id){
  if(state.products.some(p=>p.category_id===id)){ alert('This category has products in it. Reassign those products first.'); return; }
  const {error} = await sb.from('categories').delete().eq('category_id', id);
  if(error){ alert(error.message); return; }
  await loadAll(); openCategoryModal();
}
// ---------- SHOPIFY CSV IMPORT ----------
let importRows = [];
function openImportModal(){
  openModal(`
    <h2>Import from Shopify</h2>
    <p class="role-note">Upload the CSV you exported from Shopify (Products → Export). We'll pull in name, SKU, stock, price, category, and photo — you fill in real purchase cost and margin per product afterward.</p>
    <div class="field" style="margin-top:16px;"><input type="file" accept=".csv" id="csvFile" onchange="handleCsvUpload(event)"></div>
    <div id="importPreview"></div>
  `);
}
function handleCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('importPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      importRows = buildImportRows(results.data);
      renderImportPreview();
    },
    error: (err) => { document.getElementById('importPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function buildImportRows(csvRows){
  let lastTitle = '', lastType = '', lastImage = '';
  const out = [];
  for(const row of csvRows){
    const title = (row['Title'] || '').trim();
    const type = (row['Type'] || '').trim();
    const image = (row['Image Src'] || '').trim();
    if(title) lastTitle = title;
    if(type) lastType = type;
    if(image) lastImage = image;
    const sku = (row['Variant SKU'] || '').trim();
    const price = parseFloat(row['Variant Price']);
    const qty = parseInt(row['Variant Inventory Qty']);
    const optionValue = (row['Option1 Value'] || '').trim();
    if(!sku && isNaN(price)) continue; // not a product/variant row
    if(isNaN(price)) continue;
    const name = (optionValue && optionValue.toLowerCase() !== 'default title') ? `${lastTitle} - ${optionValue}` : lastTitle;
    if(!name) continue;

    });
  }

function handleImageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = `<span class="role-note">Compressing photo…</span>`;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev) => { img.src = ev.target.result; };
  img.onload = () => {
    const MAX_DIM = 900; // long edge cap, keeps files small without visible quality loss for product photos
    let {width, height} = img;
    if(width > height && width > MAX_DIM){ height = Math.round(height * MAX_DIM/width); width = MAX_DIM; }
    else if(height > MAX_DIM){ width = Math.round(width * MAX_DIM/height); height = MAX_DIM; }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
    const webpDataUrl = canvas.toDataURL('image/webp', 0.82);
    window._pendingImage = webpDataUrl;
    const kb = Math.round((webpDataUrl.length * 0.75) / 1024);
    preview.innerHTML = `<img src="${webpDataUrl}" style="width:70px;height:70px;object-fit:cover;"><div class="role-note">${width}×${height}px, ~${kb}KB (WebP)</div>`;
  };
  reader.readAsDataURL(file);
}
function previewPricing(){
  const purchase = parseFloat(document.getElementById('f_purchase').value)||0;
  const addlPct = parseFloat(document.getElementById('f_addlpct').value)||0;
  const addlFixed = parseFloat(document.getElementById('f_addlfixed').value)||0;
  const marginPct = parseFloat(document.getElementById('f_margin').value)||0;
  const landing = (purchase * (1+addlPct/100)) + addlFixed;
  const selling = landing * (1+marginPct/100);
  document.getElementById('pricingPreview').innerHTML = `Landing price: <strong>${inr(landing)}</strong> &nbsp;→&nbsp; Selling price: <strong>${inr(selling)}</strong> <br><span style="font-size:11px;">(the database recalculates these automatically on save)</span>`;
}
async function saveProduct(id){
  const btn = document.getElementById('saveProductBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const data = {
    sku: document.getElementById('f_sku').value || ('SW-'+Date.now().toString().slice(-5)),
    category_id: document.getElementById('f_cat').value,
    name: document.getElementById('f_name').value || 'Untitled',

    additional_charge_fixed: parseFloat(document.getElementById('f_addlfixed').value)||0,
    margin_pct: parseFloat(document.getElementById('f_margin').value)||0,
    gst_rate: parseFloat(document.getElementById('f_gst').value)||0,
    stock_qty: parseFloat(document.getElementById('f_stock').value)||0,
    low_stock_threshold: parseFloat(document.getElementById('f_lowstock').value)||2,
    listed_on_shopify: document.getElementById('f_listed').value === 'true',

function renderBulkEdit(main){

      <td><input value="${p.name||''}" style="width:160px;" oninput="bulkFieldChange('${p.product_id}','name',this.value,true)"></td>
      <td><select style="width:130px;" onchange="bulkFieldChange('${p.product_id}','category_id',this.value,true)">${state.categories.map(c=>`<option value="${c.category_id}" ${c.category_id===p.category_id?'selected':''}>${c.name}</option>`).join('')}</select></td>
      <td><input type="number" value="${p.stock_qty}" style="width:70px;" oninput="bulkFieldChange('${p.product_id}','stock_qty',this.value,true)"></td>
      <td><input type="number" value="${p.purchase_price}" style="width:100px;" oninput="bulkFieldChange('${p.product_id}','purchase_price',this.value)"></td>

      <td class="num" id="margin_${p.product_id}">${p.purchase_price>0 ? (((p.selling_price/p.purchase_price)-1)*100).toFixed(1) : '0.0'}%</td>
      <td><input type="number" value="${p.gst_rate}" style="width:60px;" oninput="bulkFieldChange('${p.product_id}','gst_rate',this.value,true)"></td>
    </tr>`).join('');
}
function bulkFieldChange(productId, field, value, isRaw){
  if(!bulkEditChanges[productId]) bulkEditChanges[productId] = {};
  bulkEditChanges[productId][field] = isRaw ? value : (parseFloat(value)||0);
  if(field!=='purchase_price' && field!=='selling_price') return; // only these two affect the margin preview
  const p = state.products.find(p=>p.product_id===productId);
  const purchase = bulkEditChanges[productId].purchase_price ?? p.purchase_price;
  const selling = bulkEditChanges[productId].selling_price ?? p.selling_price;
  const marginEl = document.getElementById('margin_'+productId);
  marginEl.textContent = purchase>0 ? (((selling/purchase)-1)*100).toFixed(1)+'%' : '0.0%';
}
async function saveBulkEdits(){
  const ids = Object.keys(bulkEditChanges);
  if(ids.length===0){ alert('No changes to save.'); return; }
  const btn = document.getElementById('bulkSaveBtn');
  btn.disabled = true;
  let done = 0;
  for(const id of ids){
    btn.textContent = `Saving ${done+1} of ${ids.length}…`;
    const p = state.products.find(p=>p.product_id===id);
    const changes = bulkEditChanges[id];
    const updateData = {};
    if(changes.sku !== undefined) updateData.sku = changes.sku;
    if(changes.name !== undefined) updateData.name = changes.name;
    if(changes.category_id !== undefined) updateData.category_id = changes.category_id;
    if(changes.stock_qty !== undefined) updateData.stock_qty = changes.stock_qty;
    if(changes.gst_rate !== undefined) updateData.gst_rate = changes.gst_rate;
    if(changes.purchase_price !== undefined || changes.selling_price !== undefined){
      const purchase = changes.purchase_price ?? p.purchase_price;
      const targetSelling = changes.selling_price ?? p.selling_price;
      // back-solve margin_pct so selling_price lands exactly on the target, with additional charges zeroed for simplicity
      updateData.purchase_price = purchase;
      updateData.additional_charge_pct = 0;
      updateData.additional_charge_fixed = 0;
      updateData.margin_pct = purchase>0 ? ((targetSelling/purchase)-1)*100 : 0;
    }
    const {data: updated, error} = await sb.from('products').update(updateData).eq('product_id', id).select().single();
    if(error){ alert(`Could not save ${p.sku}: ${error.message}`); continue; }
    if(updated && (changes.purchase_price !== undefined || changes.selling_price !== undefined)){
      // refresh cost snapshot on already-recorded bills for this product so profit KPIs reflect the corrected cost
      await sb.from('sale_items').update({landing_price_snapshot: updated.landing_price}).eq('product_id', id);
    }
    done++;
  }
  bulkEditChanges = {};
  await loadAll();
  nav('bulkEdit');
  alert(`Saved changes for ${done} products.`);
}

// ---------- AUTO-ESTIMATE PURCHASE PRICE FROM MARKUP RATIO ----------
function placeholderProducts(){
  // products where purchase price still equals selling price — i.e. real cost was never entered
  return state.products.filter(p => Number(p.purchase_price) === Number(p.selling_price));
}
function openAutoEstimateModal(){
  const targets = placeholderProducts();
  openModal(`
    <h2>Auto-estimate purchase price</h2>
    <p class="role-note">Applies to the ${targets.length} product${targets.length===1?'':'s'} that still show purchase price = selling price (i.e. real cost not yet entered). Products you've already corrected are left untouched.</p>
    <div class="field" style="margin-top:16px;"><label>Your usual markup — selling price is about this many times your cost</label>
      <input type="number" id="markupRatio" value="4.4" step="0.1">
    </div>
    <p class="role-note" id="markupPreview"></p>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runEstimateBtn" onclick="runAutoEstimate()">Apply estimate to ${targets.length} products</button>
    </div>
  `);
  document.getElementById('markupRatio').addEventListener('input', updateMarkupPreview);
  updateMarkupPreview();
}
function updateMarkupPreview(){
  const ratio = parseFloat(document.getElementById('markupRatio').value) || 1;
  const sample = placeholderProducts()[0];
  if(sample){
    const est = sample.selling_price / ratio;
    document.getElementById('markupPreview').textContent = `Example: "${sample.name}" sells at ${inr(sample.selling_price)} → estimated purchase price ${inr(est)}.`;
  }
}
async function runAutoEstimate(){
  const ratio = parseFloat(document.getElementById('markupRatio').value);
  if(!ratio || ratio<=1){ alert('Enter a markup greater than 1 (e.g. 4 means you sell at 4x cost).'); return; }
  const targets = placeholderProducts();
  const btn = document.getElementById('runEstimateBtn');
  btn.disabled = true;
  const marginPct = (ratio-1)*100;
  let done = 0;
  for(const p of targets){
    btn.textContent = `Estimating ${done+1} of ${targets.length}…`;
    const estimatedPurchase = Math.round((p.selling_price / ratio) * 100) / 100;
    const {data: updated} = await sb.from('products').update({
      purchase_price: estimatedPurchase,
      additional_charge_pct: 0,
      additional_charge_fixed: 0,
      margin_pct: marginPct,
    }).eq('product_id', p.product_id).select().single();
    if(updated){
      await sb.from('sale_items').update({landing_price_snapshot: updated.landing_price}).eq('product_id', p.product_id);
    }
    done++;
  }
  closeModal();
  await loadAll();
  nav('bulkEdit');
  alert(`Estimated purchase price for ${done} products using a ${ratio}x markup. Go through Bulk Edit and correct any that are actually different.`);
}

let custImportRows = [];

function findCol(row, candidates){
  for(const key of Object.keys(row)){
    if(candidates.some(c => key.toLowerCase().trim() === c)) return row[key];
  }
  return '';
}
function handleCustCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('custImportPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: (results) => {
      custImportRows = results.data.map(row => {
        let name = findCol(row, ['name','customer name','full name']);
        if(!name){
          const first = findCol(row, ['first name']);
          const last = findCol(row, ['last name']);
          name = [first, last].filter(Boolean).join(' ');
        }
        return {
          name: (name||'').trim(),
          phone: findCol(row, ['phone','phone number','default address phone']).trim(),
          email: findCol(row, ['email']).trim(),
          city: findCol(row, ['city','default address city']).trim(),
          address: findCol(row, ['address','address1','default address address1']).trim(),
        };
      }).filter(r => r.name);
      renderCustImportPreview();
    },
    error: (err) => { document.getElementById('custImportPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function renderCustImportPreview(){
  const el = document.getElementById('custImportPreview');
  if(custImportRows.length === 0){ el.innerHTML = `<div class="empty">No customer rows found — check the file has a Name column.</div>`; return; }

    <table><thead><tr><th>Name</th><th>Phone</th><th>City</th></tr></thead>
    <tbody>${custImportRows.slice(0,8).map(r=>`<tr><td>${r.name}</td><td>${r.phone||'—'}</td><td>${r.city||'—'}</td></tr>`).join('')}</tbody></table>
    ${custImportRows.length>8 ? `<div class="role-note" style="margin-top:8px;">…and ${custImportRows.length-8} more</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">

  btn.disabled = true;
  let done = 0, skipped = 0;
  for(const r of custImportRows){
    btn.textContent = `Importing ${done+skipped+1} of ${custImportRows.length}…`;
    if(r.phone && state.customers.some(c=>c.phone===r.phone)){ skipped++; continue; }
    const {error} = await sb.from('customers').insert({name:r.name, phone:r.phone, email:r.email, city:r.city, address:r.address});
    if(!error) done++; else skipped++;
  }
  closeModal();
  await loadAll();
  alert(`Imported ${done} customers${skipped>0 ? `, skipped ${skipped} (duplicates or errors)` : ''}.`);
}

let pendingRestoreData = null;
function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      pendingRestoreData = JSON.parse(ev.target.result);
      const counts = Object.entries(pendingRestoreData).filter(([k,v])=>Array.isArray(v)).map(([k,v])=>`${k}: ${v.length}`).join(', ');
      document.getElementById('restorePreview').innerHTML = `
        <p class="role-note" style="margin:10px 0;">Backup from ${pendingRestoreData.exported_at||'unknown date'} for ${pendingRestoreData.company||'—'}.<br>${counts}</p>
        <button class="gold" id="runRestoreBtn" onclick="runRestore()">Restore this data now</button>`;
    }catch(err){
      document.getElementById('restorePreview').innerHTML = `<div class="statusbar err">Could not read file: ${err.message}</div>`;
    }
  };
  reader.readAsText(file);
}
async function runRestore(){
  if(!pendingRestoreData) return;
  const btn = document.getElementById('runRestoreBtn');
  btn.disabled = true;
  // order matters: parents before children, to satisfy foreign keys
  const order = ['categories','suppliers','products','product_images','customers','team_members',
    'sales','sale_items','purchases','purchase_items','inventory_transactions',
    'wholesale_accounts','wholesale_orders','wholesale_order_items'];
  let log = [];
  for(const table of order){
    const rows = pendingRestoreData[table];
    if(!rows || rows.length===0) continue;
    btn.textContent = `Restoring ${table}…`;
    const {error} = await sb.from(table).insert(rows);
    log.push(`${table}: ${error ? 'FAILED — '+error.message : rows.length+' rows restored'}`);
  }
  // company_settings is special: the migration script already seeds id=1, so update rather than insert
  if(pendingRestoreData.company_settings && pendingRestoreData.company_settings[0]){
    const {id, ...rest} = pendingRestoreData.company_settings[0];
    const {error} = await sb.from('company_settings').update(rest).eq('id', 1);
    log.push(`company_settings: ${error ? 'FAILED — '+error.message : 'restored'}`);
  }
  btn.disabled = false;
  btn.textContent = 'Restore this data now';
  await loadAll();
  alert('Restore finished:\n\n' + log.join('\n'));
}
async function downloadFullBackup(){
  const btn = document.getElementById('backupBtn');
  btn.disabled = true; btn.textContent = 'Preparing backup…';
  try{
    const tables = ['categories','products','product_images','customers','sales','sale_items','team_members',
      'company_settings','suppliers','purchases','purchase_items','inventory_transactions',
      'wholesale_accounts','wholesale_orders','wholesale_order_items'];
    const results = await Promise.all(tables.map(t => sb.from(t).select('*')));
    const backup = {exported_at: new Date().toISOString(), company: state.company?.company_name || ''};
    tables.forEach((t,i) => { backup[t] = results[i].data || []; });
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `swasole-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Backup failed: '+e.message);
  }
  btn.disabled = false; btn.textContent = 'Download full data backup';
}
async function saveCompany(){

async function cancelWholesaleOrder(orderId){
  if(!confirm('Cancel this order request?')) return;
  await sb.from('wholesale_orders').update({status:'cancelled'}).eq('wholesale_order_id', orderId);
  closeModal(); await loadAll(); nav('wholesale');
}
async function fulfillWholesaleOrder(orderId){
  const o = state.wholesaleOrders.find(o=>o.wholesale_order_id===orderId);
  const acc = state.wholesaleAccounts.find(a=>a.account_id===o.account_id);
  const items = state.wholesaleOrderItems.filter(i=>i.wholesale_order_id===orderId);
  if(items.some(i=>{ const p = state.products.find(p=>p.product_id===i.product_id); return !p || p.stock_qty < i.quantity; })){
    if(!confirm('Some items may not have enough stock. Fulfill anyway?')) return;
  }
  const subtotal = items.reduce((s,i)=>s+i.quantity*i.wholesale_unit_price,0);
  const gstWeighted = items.reduce((s,i)=>{ const p = state.products.find(p=>p.product_id===i.product_id); return s + (p?p.gst_rate:3) * i.quantity*i.wholesale_unit_price; },0);
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 3;
  const taxable = subtotal/(1+avgGst/100);
  const totalGst = subtotal-taxable;
  const {data: sale, error: saleErr} = await sb.from('sales').insert({
    invoice_number: 'WS-' + Date.now().toString().slice(-8),
    customer_id: null,
    channel: 'wholesale',
    subtotal_before_discount: subtotal, discount_value: 0, final_amount: subtotal,
    taxable_value: taxable, cgst_amount: totalGst/2, sgst_amount: totalGst/2, igst_amount: 0,
    state_type: 'intra-state', payment_method: 'Wholesale — ' + (acc?acc.shop_name:''),
  }).select().single();
  if(saleErr){ alert('Could not create bill: '+saleErr.message); return; }
  const saleItemsData = items.map(i=>{
    const p = state.products.find(p=>p.product_id===i.product_id);
    return {sale_id: sale.sale_id, product_id: i.product_id, item_name: p?p.name:'Product', quantity: i.quantity, unit_price: i.wholesale_unit_price, landing_price_snapshot: p?p.landing_price:0, line_total: i.quantity*i.wholesale_unit_price};
  });
  await sb.from('sale_items').insert(saleItemsData);
  const invTxns = items.map(i=>({product_id: i.product_id, type:'sale_out', quantity: -i.quantity, reference_id: sale.sale_id, channel:'wholesale'}));
  await sb.from('inventory_transactions').insert(invTxns);
  for(const i of items){
    const p = state.products.find(p=>p.product_id===i.product_id);
    if(p) await sb.from('products').update({stock_qty: p.stock_qty - i.quantity}).eq('product_id', i.product_id);
  }
  await sb.from('wholesale_orders').update({status:'fulfilled', fulfilled_sale_id: sale.sale_id}).eq('wholesale_order_id', orderId);
  closeModal();
  await loadAll();
  nav('wholesale');
  alert('Order fulfilled and billed as ' + sale.invoice_number + '. Stock has been updated.');
}

    const p = state.products.find(p=>p.product_id===l.productId);
    return `<div class="cart-line">
      <span>${p.name} × <input type="number" min="1" value="${l.qty}" style="width:48px;padding:2px 4px;" onchange="updateQty(${i}, this.value)"></span>
      <span class="num">${inr(p.selling_price*l.qty)} <button class="small secondary" style="margin-left:6px;" onclick="removeLine(${i})">×</button></span>
    </div>`;
  }).join('');
}
function updateQty(i, val){ cart[i].qty = Math.max(1, parseInt(val)||1); renderCartLines(); renderCartTotals(); }
function removeLine(i){ cart.splice(i,1); renderCartLines(); renderCartTotals(); }
function computeTotals(){
  const subtotal = cart.reduce((a,l)=>{ const p = state.products.find(p=>p.product_id===l.productId); return a + p.selling_price*l.qty; },0);
  const discount = parseFloat(document.getElementById('posDiscount')?.value)||0;
  const finalAmount = Math.max(0, subtotal - discount);
  let gstWeighted = 0;
  cart.forEach(l=>{ const p = state.products.find(p=>p.product_id===l.productId); gstWeighted += (p.gst_rate * p.selling_price*l.qty); });
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 0;
  const taxable = finalAmount / (1 + avgGst/100);
  const totalGst = finalAmount - taxable;
  const stateType = document.getElementById('posStateType')?.value || 'intra-state';
  const cgst = stateType==='intra-state' ? totalGst/2 : 0;
  const sgst = stateType==='intra-state' ? totalGst/2 : 0;
  const igst = stateType==='inter-state' ? totalGst : 0;
  return {subtotal, discount, finalAmount, taxable, cgst, sgst, igst, stateType};
}
function renderCartTotals(){
  const el = document.getElementById('cartTotals');
  if(!el) return;
  const t = computeTotals();
  el.innerHTML = `
    <div class="cart-line"><span>Subtotal</span><span class="num">${inr(t.subtotal)}</span></div>
    <div class="cart-line"><span>Discount</span><span class="num">-${inr(t.discount)}</span></div>
    <div class="cart-line"><span>Taxable value</span><span class="num">${inr(t.taxable)}</span></div>
    ${t.stateType==='intra-state' ? `
    <div class="cart-line"><span>CGST</span><span class="num">${inr(t.cgst)}</span></div>
    <div class="cart-line"><span>SGST</span><span class="num">${inr(t.sgst)}</span></div>` : `
    <div class="cart-line"><span>IGST</span><span class="num">${inr(t.igst)}</span></div>`}
    <div class="cart-line" style="font-weight:700;font-size:15px;"><span>Total (payable)</span><span class="num">${inr(t.finalAmount)}</span></div>`;
}
async function completeSale(){
  if(cart.length===0){ alert('Cart is empty'); return; }
  const btn = document.getElementById('completeSaleBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  // find-or-create customer from inline fields
  const custName = document.getElementById('posCustName').value.trim();
  const custPhone = document.getElementById('posCustPhone').value.trim();
  const custAddress = document.getElementById('posCustAddress').value.trim();
  let customerId = null;
  if(custName){
    let existing = custPhone ? state.customers.find(c=>c.phone===custPhone) : state.customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
    if(existing){
      customerId = existing.customer_id;
      await sb.from('customers').update({name:custName, phone:custPhone||existing.phone, address:custAddress||existing.address}).eq('customer_id', customerId);
    }else{
      const {data: newCust, error: custErr} = await sb.from('customers').insert({name:custName, phone:custPhone, address:custAddress}).select().single();
      if(!custErr) customerId = newCust.customer_id;
    }
  }

  const t = computeTotals();
  const saleRow = {
    invoice_number: 'INV-' + Date.now().toString().slice(-8),
    customer_id: customerId,
    channel: 'store',
    subtotal_before_discount: t.subtotal, discount_value: t.discount, final_amount: t.finalAmount,
    taxable_value: t.taxable, cgst_amount: t.cgst, sgst_amount: t.sgst, igst_amount: t.igst,
    state_type: t.stateType, payment_method: document.getElementById('posPayment').value,
  };
  const {data: sale, error: saleErr} = await sb.from('sales').insert(saleRow).select().single();
  if(saleErr){ alert('Could not save sale: '+saleErr.message); btn.disabled=false; btn.textContent='Complete sale'; return; }

  const items = cart.map(l=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return {sale_id: sale.sale_id, product_id: p.product_id, item_name: p.name, quantity: l.qty, unit_price: p.selling_price, landing_price_snapshot: p.landing_price, line_total: p.selling_price*l.qty};
  });
  const {error: itemsErr} = await sb.from('sale_items').insert(items);
  if(itemsErr){ alert('Sale saved but items failed: '+itemsErr.message); }

  const invTxns = cart.map(l => ({product_id: l.productId, type:'sale_out', quantity: -l.qty, reference_id: sale.sale_id, channel:'store'}));
  await sb.from('inventory_transactions').insert(invTxns);

  for(const l of cart){
    const p = state.products.find(p=>p.product_id===l.productId);
    await sb.from('products').update({stock_qty: p.stock_qty - l.qty}).eq('product_id', p.product_id);
  }

  cart = [];
  await loadAll();
  state.route = 'orders';
  render();
  openOrderDetail(sale.sale_id);
}

async function deleteOrder(saleId){

// ---------- ORDERS CSV IMPORT (Shopify order export) ----------
let orderImportGroups = [];
function openOrderImportModal(){
  openModal(`
    <h2>Import past orders from Shopify</h2>
    <p class="role-note">Adds historical orders to your sales records for reporting. <strong>Stock is NOT changed</strong> — your current stock already reflects these past sales. GST is approximated as an even CGST/SGST split from Shopify's total tax, since Shopify doesn't export the exact breakdown. Line items whose SKU doesn't match a product here will be skipped.</p>
    <div class="field" style="margin-top:16px;"><input type="file" accept=".csv" onchange="handleOrderCsvUpload(event)"></div>
    <div id="orderImportPreview"></div>
  `);
}
function handleOrderCsvUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('orderImportPreview').innerHTML = `<div class="role-note" style="margin-top:12px;">Reading file…</div>`;
  Papa.parse(file, {
    header: true, skipEmptyLines: true,
    complete: (results) => { orderImportGroups = buildOrderGroups(results.data); renderOrderImportPreview(); },
    error: (err) => { document.getElementById('orderImportPreview').innerHTML = `<div class="statusbar err" style="margin-top:12px;">Could not read file: ${err.message}</div>`; }
  });
}
function buildOrderGroups(csvRows){
  const groups = {};
  let lastOrderName = '';
  for(const row of csvRows){
    const orderName = (findCol(row, ['name','order','order name']) || '').trim() || lastOrderName;
    if(!orderName) continue;
    lastOrderName = orderName;
    if(!groups[orderName]){
      const addr1 = findCol(row, ['billing address1','shipping address1']).trim();
      const city = findCol(row, ['billing city','shipping city']).trim();
      groups[orderName] = {
        orderName,
        email: findCol(row, ['email']).trim(),
        phone: findCol(row, ['phone','billing phone','shipping phone']).trim(),
        custName: findCol(row, ['billing name','shipping name']).trim(),
        address: [addr1, city].filter(Boolean).join(', '),
        total: parseFloat(findCol(row, ['total'])) || 0,
        taxes: parseFloat(findCol(row, ['taxes'])) || 0,
        discount: parseFloat(findCol(row, ['discount amount'])) || 0,
        createdAt: findCol(row, ['created at','paid at']) || new Date().toISOString(),
        financialStatus: findCol(row, ['financial status']).trim(),
        items: [],
      };
    }
    const sku = findCol(row, ['lineitem sku']).trim();
    const name = findCol(row, ['lineitem name']).trim();
    const qty = parseInt(findCol(row, ['lineitem quantity'])) || 0;
    const price = parseFloat(findCol(row, ['lineitem price']));
    if((sku || name) && qty && !isNaN(price)){
      groups[orderName].items.push({sku, name, qty, price});
    }
  }
  return Object.values(groups).filter(g => g.items.length > 0 && g.total > 0);
}
function matchProductForItem(it){
  if(it.sku){
    const bySku = state.products.find(p => p.sku.trim().toLowerCase() === it.sku.trim().toLowerCase());
    if(bySku) return bySku;
  }
  if(it.name){
    const byName = state.products.find(p => p.name.trim().toLowerCase() === it.name.trim().toLowerCase());
    if(byName) return byName;
  }
  return null;
}
function renderOrderImportPreview(){
  const el = document.getElementById('orderImportPreview');
  if(orderImportGroups.length === 0){ el.innerHTML = `<div class="empty">No orders found. Make sure it's the standard Shopify order export.</div>`; return; }
  const matchable = orderImportGroups.filter(g => g.items.every(it => matchProductForItem(it)));
  el.innerHTML = `
    <div class="role-note" style="margin:14px 0;">${orderImportGroups.length} orders found, ${matchable.length} with every item matched to your catalog (by SKU or name). Unmatched items still get imported with their name and price — just without a catalog link (won't affect profit KPIs until linked).</div>
    <table><thead><tr><th>Order</th><th>Customer</th><th class="num">Total</th><th>Items match?</th></tr></thead>
    <tbody>${orderImportGroups.slice(0,8).map(g=>`<tr><td>${g.orderName}</td><td>${g.custName||g.email||'—'}</td><td class="num">${inr(g.total)}</td><td>${g.items.every(it=>matchProductForItem(it)) ? '<span style="color:var(--sage)">yes</span>' : '<span class="badge-low">some unmatched</span>'}</td></tr>`).join('')}</tbody></table>
    ${orderImportGroups.length>8 ? `<div class="role-note" style="margin-top:8px;">…and ${orderImportGroups.length-8} more</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="runOrderImportBtn" onclick="runOrderImport()">Import ${orderImportGroups.length} orders</button>
    </div>`;
}
async function runOrderImport(){
  const btn = document.getElementById('runOrderImportBtn');
  btn.disabled = true;
  let done = 0, unmatchedItems = 0;
  for(const g of orderImportGroups){
    btn.textContent = `Importing ${done+1} of ${orderImportGroups.length}…`;
    let customerId = null;
    if(g.custName || g.email){
      let existing = g.email ? state.customers.find(c=>c.email===g.email) : null;
      if(!existing && g.phone) existing = state.customers.find(c=>c.phone===g.phone);
      if(existing){
        customerId = existing.customer_id;
        const patch = {};
        if(!existing.phone && g.phone) patch.phone = g.phone;
        if(!existing.address && g.address) patch.address = g.address;
        if(Object.keys(patch).length) await sb.from('customers').update(patch).eq('customer_id', customerId);
      }else{
        const {data:newCust} = await sb.from('customers').insert({name:g.custName||g.email, phone:g.phone, email:g.email, address:g.address}).select().single();
        if(newCust){ customerId = newCust.customer_id; state.customers.push(newCust); }
      }
    }
    const finalAmount = g.total;
    // Shopify's own "Taxes" export is frequently 0 even when the price genuinely includes GST
    // (common when GST wasn't configured as a separate line in Shopify). So instead of trusting
    // that column, we impute GST the same way the rest of the app does: work backward from the
    // final amount actually paid, using each item's own GST rate where we can match the product.
    let gstWeighted = 0;
    g.items.forEach(it=>{ const p = matchProductForItem(it); gstWeighted += (p ? p.gst_rate : 3) * it.price*it.qty; });
    const avgGst = finalAmount>0 ? gstWeighted/finalAmount : 3;
    const taxable = finalAmount / (1+avgGst/100);
    const totalGst = finalAmount - taxable;
    const {data: sale, error: saleErr} = await sb.from('sales').insert({
      invoice_number: g.orderName,
      customer_id: customerId,
      channel: 'online',
      sale_date: g.createdAt,
      subtotal_before_discount: finalAmount + g.discount,
      discount_value: g.discount,
      final_amount: finalAmount,
      taxable_value: taxable,
      cgst_amount: totalGst/2, sgst_amount: totalGst/2, igst_amount: 0,
      state_type: 'intra-state',
      payment_method: g.financialStatus || 'Online',
    }).select().single();
    if(saleErr) continue;
    const items = g.items.map(it => {
      const p = matchProductForItem(it);
      if(!p) unmatchedItems++;
      return {
        sale_id: sale.sale_id,
        product_id: p ? p.product_id : null,
        item_name: it.name || (p ? p.name : 'Product'),
        quantity: it.qty,
        unit_price: it.price,
        landing_price_snapshot: p ? p.landing_price : it.price,
        line_total: it.price*it.qty,
      };
    });
    if(items.length>0) await sb.from('sale_items').insert(items);
    done++;
  }
  closeModal();
  await loadAll();
  alert(`Imported ${done} orders.${unmatchedItems>0 ? ` ${unmatchedItems} line items couldn't be matched to a catalog product but were still recorded with their name.` : ''} Stock was not changed.`);
}

      <div class="field"><label>Price sold at (₹)</label><input type="number" id="h_price"></div>
      <div class="field" style="display:flex;align-items:flex-end;"><button class="secondary" style="width:100%;" onclick="addHistItem()">+ Add item</button></div>
    </div>
    <div id="histCartLines" style="margin:14px 0;"></div>
    <div class="grid2">
      <div class="field"><label>Discount (₹)</label><input type="number" id="h_discount" value="0"></div>
      <div class="field"><label>Sale type</label><select id="h_stateType"><option value="intra-state">Intra-state</option><option value="inter-state">Inter-state</option></select></div>
    </div>
    <div id="histTotalPreview" class="role-note" style="margin-bottom:14px;"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="gold" id="saveHistBtn" onclick="saveHistoricalSale()">Save past sale</button>
    </div>
  `);
  // prefill price when a product is chosen
  document.getElementById('h_productSelect').addEventListener('change', function(){
    const p = state.products.find(p=>p.product_id===this.value);
    if(p) document.getElementById('h_price').value = p.selling_price;
  });
  renderHistCartLines();
}
function addHistItem(){
  const productId = document.getElementById('h_productSelect').value;
  const qty = parseInt(document.getElementById('h_qty').value)||1;
  const price = parseFloat(document.getElementById('h_price').value);
  if(!productId || isNaN(price)){ alert('Choose a product and a price.'); return; }
  histCart.push({productId, qty, price});
  renderHistCartLines();
}
function removeHistItem(i){ histCart.splice(i,1); renderHistCartLines(); }
function renderHistCartLines(){
  const el = document.getElementById('histCartLines');
  if(histCart.length===0){ el.innerHTML = `<div class="empty">No items added yet.</div>`; document.getElementById('histTotalPreview').textContent=''; return; }
  el.innerHTML = histCart.map((l,i)=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return `<div class="cart-line"><span>${p.name} × ${l.qty}</span><span class="num">${inr(l.price*l.qty)} <button class="small secondary" style="margin-left:6px;" onclick="removeHistItem(${i})">×</button></span></div>`;
  }).join('');
  const subtotal = histCart.reduce((a,l)=>a+l.price*l.qty,0);
  document.getElementById('histTotalPreview').textContent = `Subtotal so far: ${inr(subtotal)}`;
}
async function saveHistoricalSale(){
  if(histCart.length===0){ alert('Add at least one item.'); return; }
  const btn = document.getElementById('saveHistBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const custName = document.getElementById('h_custname').value.trim();
  const custPhone = document.getElementById('h_custphone').value.trim();
  let customerId = null;
  if(custName){
    let existing = custPhone ? state.customers.find(c=>c.phone===custPhone) : state.customers.find(c=>c.name.toLowerCase()===custName.toLowerCase());
    if(existing) customerId = existing.customer_id;
    else{
      const {data:newCust} = await sb.from('customers').insert({name:custName, phone:custPhone}).select().single();
      if(newCust) customerId = newCust.customer_id;
    }
  }
  const subtotal = histCart.reduce((a,l)=>a+l.price*l.qty,0);
  const discount = parseFloat(document.getElementById('h_discount').value)||0;
  const finalAmount = Math.max(0, subtotal - discount);
  let gstWeighted = 0;
  histCart.forEach(l=>{ const p = state.products.find(p=>p.product_id===l.productId); gstWeighted += (p.gst_rate * l.price*l.qty); });
  const avgGst = subtotal>0 ? gstWeighted/subtotal : 0;
  const taxable = finalAmount / (1+avgGst/100);
  const totalGst = finalAmount - taxable;
  const stateType = document.getElementById('h_stateType').value;
  const dateVal = document.getElementById('h_date').value;
  const customBillNum = document.getElementById('h_billnum').value.trim();

  const {data: sale, error: saleErr} = await sb.from('sales').insert({
    invoice_number: customBillNum || ('OFF-' + Date.now().toString().slice(-8)),
    customer_id: customerId,
    channel: 'store',
    sale_date: dateVal,
    subtotal_before_discount: subtotal,
    discount_value: discount,
    final_amount: finalAmount,
    taxable_value: taxable,
    cgst_amount: stateType==='intra-state' ? totalGst/2 : 0,
    sgst_amount: stateType==='intra-state' ? totalGst/2 : 0,
    igst_amount: stateType==='inter-state' ? totalGst : 0,
    state_type: stateType,
    payment_method: document.getElementById('h_payment').value,
  }).select().single();
  if(saleErr){
    if(saleErr.message.includes('duplicate') || saleErr.code==='23505') alert('That bill number is already used on another invoice — choose a different one.');
    else alert('Could not save: '+saleErr.message);
    btn.disabled=false; btn.textContent='Save past sale'; return;
  }

  const items = histCart.map(l=>{
    const p = state.products.find(p=>p.product_id===l.productId);
    return {sale_id: sale.sale_id, product_id: p.product_id, item_name: p.name, quantity: l.qty, unit_price: l.price, landing_price_snapshot: p.landing_price, line_total: l.price*l.qty};
  });
  await sb.from('sale_items').insert(items);
  // deliberately no inventory_transactions or stock_qty change — this sale already happened before tracking started

  closeModal();
  await loadAll();
  alert('Past sale recorded: ' + sale.invoice_number);
}

function downloadReportCsv(){
  const sales = [...reportPeriodSales()].sort((a,b)=>new Date(a.sale_date)-new Date(b.sale_date));
  const periodLabel = reportMode==='monthly' ? reportMonth : String(reportYear);
  const header = ['Bill Number','Date','Customer','Channel','Payment Method','Subtotal','Discount','Taxable Value','CGST','SGST','IGST','Total'];
  const rows = sales.map(s=>{
    const cust = state.customers.find(c=>c.customer_id===s.customer_id);
    return [
      s.invoice_number,
      new Date(s.sale_date).toLocaleDateString('en-IN'),
      cust ? cust.name : 'Walk-in',
      s.channel,
      s.payment_method || '',
      s.subtotal_before_discount,
      s.discount_value,
      s.taxable_value,
      s.cgst_amount,
      s.sgst_amount,
      s.igst_amount,
      s.final_amount,
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `swasole-sales-register-${periodLabel}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function updateDashFilters(){
  dashFilters.range = document.getElementById('fRange').value;
  dashFilters.channel = document.getElementById('fChannel').value;
  dashFilters.categoryId = document.getElementById('fCategory').value;
  renderDashBody();
}
function itemsForSale(saleId){ return state.saleItems.filter(i=>i.sale_id===saleId); }
function filteredSales(){
  const now = new Date();
  return state.sales.filter(s=>{
    if(dashFilters.range!=='all'){
      const days = parseInt(dashFilters.range);
      const cutoff = new Date(now.getTime() - days*24*60*60*1000);
      if(new Date(s.sale_date) < cutoff) return false;
    }
    if(dashFilters.channel!=='all' && s.channel!==dashFilters.channel) return false;
    if(dashFilters.categoryId!=='all'){
      const has = itemsForSale(s.sale_id).some(it=>{
        const p = state.products.find(p=>p.product_id===it.product_id);
        return p && p.category_id === dashFilters.categoryId;
      });
      if(!has) return false;
    }
    return true;
  });
}
function renderDashBody(){
  const el = document.getElementById('dashBody');
  const sales = filteredSales();
  if(sales.length===0 && state.sales.length===0){
    el.innerHTML = `<div class="empty">No sales recorded yet. Numbers will appear here once you start billing.</div>`;
    return;
  }
  const revenue = sales.reduce((a,s)=>a+Number(s.final_amount),0);
  const orders = sales.length;
  const allItems = sales.flatMap(s=>itemsForSale(s.sale_id));
  const units = allItems.reduce((a,i)=>a+i.quantity,0);
  const aov = orders>0 ? revenue/orders : 0;
  const profit = allItems.reduce((a,i)=>a+(Number(i.unit_price)-Number(i.landing_price_snapshot))*i.quantity,0);
  const margin = revenue>0 ? (profit/revenue*100) : 0;
  const gstCollected = sales.reduce((a,s)=>a+Number(s.cgst_amount)+Number(s.sgst_amount)+Number(s.igst_amount),0);
  const discountTotal = sales.reduce((a,s)=>a+Number(s.discount_value),0);
  const storeRev = sales.filter(s=>s.channel==='store').reduce((a,s)=>a+Number(s.final_amount),0);
  const onlineRev = sales.filter(s=>s.channel==='online').reduce((a,s)=>a+Number(s.final_amount),0);
  const inventoryValue = state.products.reduce((a,p)=>a+Number(p.landing_price)*p.stock_qty,0);
  const lowStock = state.products.filter(p=>p.stock_qty<=p.low_stock_threshold);
  const outOfStock = state.products.filter(p=>p.stock_qty<=0);
  const custIds = [...new Set(sales.map(s=>s.customer_id).filter(Boolean))];
  const repeatCustomers = custIds.filter(cid => sales.filter(s=>s.customer_id===cid).length>=2);
  const repeatRate = custIds.length>0 ? (repeatCustomers.length/custIds.length*100) : 0;

  const prodRev = {};
  allItems.forEach(it=>{ const p = state.products.find(p=>p.product_id===it.product_id); const name = p ? p.name : (it.item_name || 'Unlinked product'); prodRev[name] = (prodRev[name]||0) + Number(it.line_total); });
  const topProducts = Object.entries(prodRev).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxProdRev = Math.max(1, ...topProducts.map(p=>p[1]));

  const catRev = {};
  allItems.forEach(it=>{ const p = state.products.find(p=>p.product_id===it.product_id); const cname = p ? catName(p.category_id) : 'Other'; catRev[cname] = (catRev[cname]||0) + Number(it.line_total); });
  const catEntries = Object.entries(catRev);
  const maxCatRev = Math.max(1, ...catEntries.map(c=>c[1]));

  // revenue trend by day (bucketed to at most ~14 bars for readability)
  const dayRev = {};
  sales.forEach(s=>{
    const d = new Date(s.sale_date).toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
    dayRev[d] = (dayRev[d]||0) + Number(s.final_amount);
  });
  let trendEntries = Object.entries(dayRev).sort((a,b)=> new Date(a[0]+' 2025') - new Date(b[0]+' 2025'));
  if(trendEntries.length > 14){
    // collapse into ~14 buckets by grouping consecutive days
    const bucketSize = Math.ceil(trendEntries.length/14);
    const bucketed = [];
    for(let i=0;i<trendEntries.length;i+=bucketSize){
      const chunk = trendEntries.slice(i, i+bucketSize);
      const label = chunk.length>1 ? `${chunk[0][0]}–${chunk[chunk.length-1][0]}` : chunk[0][0];
      bucketed.push([label, chunk.reduce((a,c)=>a+c[1],0)]);
    }
    trendEntries = bucketed;
  }
  const maxTrend = Math.max(1, ...trendEntries.map(t=>t[1]));

  // stock by category — current snapshot, not filtered by date/channel
  const stockByCat = {};
  const valueByCat = {};
  state.products.forEach(p=>{
    const cname = catName(p.category_id);
    stockByCat[cname] = (stockByCat[cname]||0) + p.stock_qty;
    valueByCat[cname] = (valueByCat[cname]||0) + (p.landing_price * p.stock_qty);
  });
  const stockEntries = Object.entries(stockByCat).sort((a,b)=>b[1]-a[1]);
  const maxStock = Math.max(1, ...stockEntries.map(s=>s[1]));
  const valueEntries = Object.entries(valueByCat).sort((a,b)=>b[1]-a[1]);
  const maxValue = Math.max(1, ...valueEntries.map(v=>v[1]));

  el.innerHTML = `
    <div class="section-title">Sales &amp; revenue</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Revenue</div><div class="value">${inr(revenue)}</div></div>
      <div class="kpi"><div class="label">Orders</div><div class="value">${orders}</div></div>
      <div class="kpi"><div class="label">Units sold</div><div class="value">${units}</div></div>
      <div class="kpi"><div class="label">Avg order value</div><div class="value">${inr(aov)}</div></div>
      <div class="kpi"><div class="label">Store vs online</div><div class="value" style="font-size:16px;">${inr(storeRev)} / ${inr(onlineRev)}</div></div>
    </div>

    <div class="section-title">Revenue trend</div>
    <div class="bar-chart" style="margin-bottom:28px;">
      ${trendEntries.length===0 ? '<div class="empty">No data for this filter.</div>' : trendEntries.map(([label,rev])=>`
        <div class="col">
          <div class="bar" style="height:${Math.max(2,(rev/maxTrend*140))}px;" title="${inr(rev)}"></div>
          <div class="barlabel">${label}<br>${inr(rev)}</div>
        </div>`).join('')}
    </div>

    <div class="section-title">Profitability</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Gross profit</div><div class="value">${inr(profit)}</div></div>
      <div class="kpi"><div class="label">Gross margin</div><div class="value">${margin.toFixed(1)}%</div></div>
      <div class="kpi"><div class="label">Discount given</div><div class="value">${inr(discountTotal)}</div></div>
    </div>
    <div class="section-title">Inventory</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Inventory value</div><div class="value">${inr(inventoryValue)}</div></div>
      <div class="kpi"><div class="label">Low stock</div><div class="value ${lowStock.length>0?'badge-low':''}">${lowStock.length}</div></div>
      <div class="kpi"><div class="label">Out of stock</div><div class="value ${outOfStock.length>0?'badge-low':''}">${outOfStock.length}</div></div>
    </div>
    <div class="grid2" style="margin-bottom:28px;">
      <div><div class="section-title">Stock on hand by category (units)</div>
        ${stockEntries.length===0 ? '<div class="empty">No products yet.</div>' : stockEntries.map(([name,qty])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(qty/maxStock*100)}%;"></div></div>
          <div class="hbar-val">${qty} units</div></div>`).join('')}
      </div>
      <div><div class="section-title">Stock value by category (₹)</div>
        ${valueEntries.length===0 ? '<div class="empty">No products yet.</div>' : valueEntries.map(([name,val])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(val/maxValue*100)}%;"></div></div>
          <div class="hbar-val">${inr(val)}</div></div>`).join('')}
      </div>
    </div>
    <div class="section-title">Tax</div>
    <div class="kpi-grid"><div class="kpi"><div class="label">GST collected</div><div class="value">${inr(gstCollected)}</div></div></div>
    <div class="section-title">Customers</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Buyers (period)</div><div class="value">${custIds.length}</div></div>
      <div class="kpi"><div class="label">Repeat rate</div><div class="value">${repeatRate.toFixed(0)}%</div></div>
    </div>
    <div class="grid2" style="margin-top:8px;">
      <div><div class="section-title">Top products by revenue</div>
        ${topProducts.length===0 ? '<div class="empty">No data for this filter.</div>' : topProducts.map(([name,rev])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(rev/maxProdRev*100)}%;"></div></div>
          <div class="hbar-val">${inr(rev)}</div></div>`).join('')}
      </div>
      <div><div class="section-title">Revenue by category</div>
        ${catEntries.length===0 ? '<div class="empty">No data for this filter.</div>' : catEntries.map(([name,rev])=>`
          <div class="hbar-row"><div class="name">${name}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:${(rev/maxCatRev*100)}%;"></div></div>
          <div class="hbar-val">${inr(rev)}</div></div>`).join('')}
      </div>
    </div>`;
}

// ================= AUTH ================
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter both email and password.'; return; }
  btn.disabled = true; btn.textContent = 'Logging in…';
  const {error} = await sb.auth.signInWithPassword({email, password});
  btn.disabled = false; btn.textContent = 'Log in';
  if(error){ errEl.textContent = error.message; return; }
  await showApp();
}
async function doLogout(){
  await sb.auth.signOut();
  window.location.reload();
}
async function showApp(){
  document.getElementById('loginScreen').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
  document.getElementById('mobileTabs').style.display = '';
  await loadAll();
}
async function initAuth(){
  const {data: {session}} = await sb.auth.getSession();
  if(session){
    await showApp();
  }else{
    document.getElementById('loginScreen').classList.add('show');
    document.getElementById('loginScreen').style.display = 'flex';
  }
}
sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT'){
    document.getElementById('appShell').style.display = 'none';
    document.getElementById('mobileTabs').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
});

initAuth();
</script>
</body>
</html>
